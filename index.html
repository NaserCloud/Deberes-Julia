<style>
:root{--bg:#fff8f0;--card:#fff;--ink:#2d2a45;--mute:#6f6c86;--pri:#6c5ce7;--pri2:#5546d6;--ok:#16a34a;--okbg:#e7f8ee;--bad:#e11d48;--badbg:#ffe8ed;--warn:#f59e0b;--line:#e7e1f5;--r:18px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

.brand{background:none;border:0;color:#fff;font:inherit;font-weight:800;font-size:1.15rem;cursor:pointer}
.role{display:flex;background:rgba(255,255,255,.2);border-radius:999px;padding:3px}
.role button{border:0;background:none;color:#fff;font:inherit;font-weight:700;padding:8px 16px;border-radius:999px;cursor:pointer;min-height:44px}
.role button.on{background:#fff;color:var(--pri)}
/* padding inferior generoso (antes 60px): en pantallas largas (p.ej. la ficha de teoría de
   Análisis Morfológico, con sus tarjetas y tablas) hacía falta más espacio en blanco debajo del
   todo -- sin él, al llegar casi al final del todo, el navegador del móvil (la barra de
   direcciones que se esconde/aparece al hacer scroll) podía "pelearse" con el alto de la página y
   dar saltos raros justo en el último tramo. Con más margen de sobra abajo, nunca se llega a ese
   límite y el scroll queda suave. */
main{max-width:920px;margin:0 auto;padding:18px 16px 160px}
h1{font-size:2rem;margin:.2em 0}h2{font-size:1.5rem;margin:.3em 0 .6em}h3{margin:.2em 0 .5em}
.mute{color:var(--mute)}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 20px;min-height:52px;cursor:pointer;background:#ece9fb;color:var(--pri2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--pri);color:#fff}.btn.success{background:var(--ok);color:#fff}.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.big{font-size:1.2rem;min-height:60px;padding:14px 26px}
.link{background:none;border:0;color:var(--pri2);font:inherit;font-weight:700;cursor:pointer;padding:8px 0;min-height:44px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
/* "cuadro" que acepta arrastrar y soltar fotos encima (en vez de tener que pulsar el botón de
   subir): mientras se arrastra algo por encima, un borde discontinuo del color de la app avisa de
   que ahí se puede soltar. Ver data-dropzone en el JS. */
[data-dropzone]{position:relative}
[data-dropzone].dropzone-on{outline:3px dashed var(--pri);outline-offset:-3px;background:#efecfd;border-radius:var(--r)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
.tile{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;font:inherit;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;cursor:pointer;color:var(--ink)}
.tile .ico{font-size:2.6rem}.tile b{font-size:1.4rem}.tile small{color:var(--mute)}
.tile.soon{opacity:.5;cursor:default;border-style:dashed}
.list button.item{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font:inherit;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:8px 0;cursor:pointer;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 22px}
label.f{display:block;font-weight:700}
label.f span.v{float:right;color:var(--pri2)}
input[type=range]{width:100%;height:36px;accent-color:var(--pri)}
input[type=text],input[type=password],input[type=number],select,textarea{font:inherit;font-size:18px;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:38vh;line-height:1.6;resize:vertical}
textarea.short{min-height:90px}
input:focus,textarea:focus,select:focus{outline:3px solid #c9c2f7;border-color:var(--pri)}
.status{display:flex;align-items:center;gap:12px;background:#f3f0ff;border-radius:var(--r);padding:14px 16px;margin:14px 0;font-weight:700}
.status .ico{font-size:1.8rem}
.bar{height:10px;background:#e7e1f5;border-radius:99px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.marked{white-space:pre-wrap;font-size:1.25rem;line-height:2;background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:16px}
.marked .bad{color:var(--bad);font-weight:800;background:var(--badbg);border-radius:6px;padding:0 4px;text-decoration:underline wavy}
.tbox{position:sticky;z-index:4;background:var(--bg);padding:8px 0 6px;margin-top:6px}
.tbox-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:1.05rem}.tbox-h .mute{font-size:.8rem}
.cmp{max-height:40vh;overflow:auto;-webkit-overflow-scrolling:touch;border:2px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:0 4px 10px rgba(45,42,69,.12);font-size:.98rem;line-height:1.55}
.chead,.crow{display:grid;grid-template-columns:1fr 1fr}.cmp.one .chead,.cmp.one .crow{grid-template-columns:1fr}
.chead{position:sticky;top:0;z-index:2;font-weight:800;font-size:.9rem;background:#fff;border-bottom:2px solid var(--line)}
.chead>div{padding:5px 12px}.chead>div+div{background:#dbe8ff;box-shadow:inset 3px 0 #3b82f6}
.cs,.co{padding:4px 12px;min-width:0;line-height:1.7;overflow-wrap:anywhere}.cs{background:#fff}.co{background:#eaf2ff;color:#1e3a8a;box-shadow:inset 3px 0 #3b82f6}
.cmp sup{font-size:.65em;line-height:0;position:relative;top:-.35em;vertical-align:baseline}
.cmp .bad,.cmp .miss,.cmp .fixed,.cmp .gone,.cmp b{line-height:1}.cmp .miss{display:inline-block;vertical-align:baseline}
.cmp.one .co{display:none}.crow.para .cs,.crow.para .co{padding-top:12px}
.cmp .bad{color:var(--bad);font-weight:800;background:var(--badbg);border-radius:6px;padding:0 3px;text-decoration:underline wavy}
.cmp .miss{color:var(--bad);font-weight:800;border:2px dashed var(--bad);border-radius:8px;padding:0 5px;font-size:.85rem}
.cmp .punct{text-decoration:underline dotted var(--warn);text-decoration-thickness:3px;text-underline-offset:4px}
.cmp .fixed{color:var(--ok);font-weight:800;background:var(--okbg);border-radius:6px;padding:0 3px}
.cmp .gone{color:var(--mute);text-decoration:line-through}.cmp .blank{color:#93a3c0}
@media(min-width:760px){.cmp{max-height:44vh;font-size:1.08rem}.cs,.co{padding:4px 14px}}
.step{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.step h4{margin:0 0 12px;font-size:1.1rem;display:flex;align-items:center;gap:8px}.step h4 .n{background:var(--pri);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;flex:none}
.lbl{font-weight:800;font-size:.9rem;color:var(--mute);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:.95rem;font-weight:700;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;border:2px solid var(--line);background:#fff;border-radius:16px;cursor:pointer;color:var(--ink)}
.act span{font-size:1.8rem}.act.on{border-color:var(--pri);background:#f3f0ff;box-shadow:0 0 0 2px var(--pri) inset}.act.dis{opacity:.45}
.sub{margin-top:12px;padding:14px;background:#faf9ff;border-radius:14px;border:1px solid var(--line)}
.sumbar{position:sticky;bottom:8px;z-index:3;background:#fff;border:2px solid var(--pri);border-radius:var(--r);padding:12px 16px;margin:14px 0;box-shadow:0 6px 18px rgba(45,42,69,.18)}
.agenda{border:2px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;margin-top:8px}
.agrow{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}.agrow:first-child{border-top:0}
.agt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.tag{background:#f3f0ff;color:var(--pri2);border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:700}
.xbtn{margin-left:auto;border:0;background:none;font-size:1.1rem;cursor:pointer;padding:6px;opacity:.6}
@media(max-width:560px){.agrow{grid-template-columns:1fr;gap:4px}.acts{gap:6px}}
.exph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:10px}
.exph-item{position:relative;padding:0;border:2px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;aspect-ratio:1;background:#fff}
.exph-item img{width:100%;height:100%;object-fit:cover;display:block}
.exph-warn{position:absolute;top:2px;right:2px;background:var(--bad);color:#fff;border-radius:50%;width:20px;height:20px;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.exph-ov{position:fixed;inset:0;background:rgba(20,16,40,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.exph-box{background:#fff;border-radius:var(--r);padding:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.tgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:760px){.tgrid{grid-template-columns:1fr 1fr;gap:12px}}
.tbox .marked.orig{background:#eaf2ff;border-color:#3b82f6;color:#1e3a8a}
.tbox .tgrid .marked{max-height:14vh;font-size:.95rem;line-height:1.5;padding:8px 12px}.tgrid .tbox-h{margin-bottom:3px;font-size:.95rem}
@media(min-width:760px){.tbox .tgrid .marked{max-height:34vh;font-size:1.1rem;line-height:1.8;padding:12px 14px}.tgrid .tbox-h{font-size:1.05rem;margin-bottom:6px}}
.tbox .marked{max-height:34vh;overflow:auto;-webkit-overflow-scrolling:touch;font-size:1.1rem;line-height:1.8;padding:12px 14px;box-shadow:0 4px 10px rgba(45,42,69,.12)}
.marked .fixed{color:var(--ok);font-weight:800;background:var(--okbg);border-radius:6px;padding:0 4px}
.marked .gone{color:var(--mute);text-decoration:line-through}
.marked .miss{color:var(--bad);font-weight:800;border:2px dashed var(--bad);border-radius:8px;padding:0 6px;font-size:.9rem}
.marked .punct{text-decoration:underline dotted var(--warn);text-decoration-thickness:3px;text-underline-offset:5px}
sup{color:var(--bad);font-weight:800}
.card{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.done{border-color:#86e0a8;background:var(--okbg)}
.card .num{display:inline-block;background:var(--bad);color:#fff;border-radius:99px;min-width:28px;text-align:center;font-weight:800;padding:0 8px;margin-right:6px}
.card.done .num{background:var(--ok)}
.wrong{color:var(--bad);font-weight:800}.right{color:var(--ok);font-weight:800}
.opts{display:grid;gap:10px;margin-top:10px}
.opts button{font:inherit;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;color:var(--ink);min-height:56px}
.opts button.no{border-color:var(--bad);background:var(--badbg);opacity:.7}.opts button.yes{border-color:var(--ok);background:var(--okbg)}
.rule{background:#eef6ff;border-left:6px solid #3b82f6;border-radius:10px;padding:10px 14px;margin-top:10px}
.wrule{position:relative;display:inline}
.wrule-btn{all:unset;display:inline;cursor:pointer;border-radius:6px;padding:0 2px;margin:0 -2px;transition:background .15s}
.wrule-btn:hover,.wrule-btn:focus{background:#ece9fb;outline:none}
.wrule-tip{display:none;position:absolute;top:100%;left:0;z-index:6;background:#eef6ff;border-left:6px solid #3b82f6;border-radius:10px;padding:8px 12px;margin-top:6px;font-size:.85rem;font-weight:400;line-height:1.35;white-space:normal;width:max-content;max-width:260px;box-shadow:0 4px 10px rgba(45,42,69,.15)}
.wrule-btn:hover+.wrule-tip,.wrule-btn:focus+.wrule-tip{display:block}
/* palabras pulsables de la frase en el ejercicio de Preposiciones (ver prepSentHTML, p6a.js):
   cada palabra es un botón suelto dentro del texto -- antes de responder, estilo neutro con
   hover; tras pulsar una, la preposición correcta se marca en verde y, si se pulsó otra
   distinta, esa se marca en rojo con subrayado ondulado (igual que el resto de la app). */
.prepw{all:unset;display:inline;cursor:pointer;border-radius:6px;padding:0 3px;margin:0 1px}
.prepw:hover,.prepw:focus{background:#ece9fb;outline:none}
.prepw:disabled{cursor:default}
.prepw.ok{color:var(--ok);font-weight:800;background:var(--okbg)}
.prepw.bad{color:var(--bad);font-weight:800;background:var(--badbg);text-decoration:underline wavy}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;max-width:420px}
.mini-card{aspect-ratio:1;border:2px solid var(--line);border-radius:14px;background:#ece9fb;font-size:1.8rem;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mini-card.flip{background:#fff;border-color:var(--pri)}
.mini-card:disabled{cursor:default}
.mini-kb{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.mini-kb .btn{padding:10px 14px;min-height:44px;min-width:44px}
.msg{margin-top:8px;font-weight:700}
/* ficha de teoría de Análisis Morfológico (morfoTheoryBodyHTML): tarjetas de colores por
   categoría + tablas de subtipos, pensadas para leerse fácil (y para imprimirse, como el PDF). */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:14px}
.mcard{border-radius:var(--r);border:2px solid;padding:14px 16px}
.mcard .mtop{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mcard .mtop .ico{font-size:1.5rem}
.mcard h3{margin:0;font-size:1.05rem}
.mcard p{margin:6px 0;line-height:1.4}
.mcard .mex{background:rgba(255,255,255,.6);border-radius:10px;padding:6px 10px;font-size:.92rem}
.mtable{width:100%;border-collapse:collapse;margin:10px 0 18px;font-size:.92rem}
.mtable th{text-align:left;background:var(--pri);color:#fff;padding:8px 10px;font-size:.88rem}
.mtable th:first-child{border-radius:10px 0 0 0}.mtable th:last-child{border-radius:0 10px 0 0}
.mtable td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.mtable tr:nth-child(even) td{background:#f8f8fc}
.mtable td.mex{color:var(--pri2);font-weight:700;background:none;padding:7px 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{font:inherit;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;min-width:200px}
.seg button.on{background:var(--pri);color:#fff}
table{width:100%;border-collapse:collapse}td{padding:6px 4px;vertical-align:top}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2d2a45;color:#fff;padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90vw}
#toast.on{opacity:1}
details summary{font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.shake{animation:shake .3s}
.appver{position:fixed;bottom:3px;right:8px;font-size:.65rem;color:var(--mute);opacity:.55;z-index:50;cursor:pointer;background:var(--bg);padding:1px 6px;border-radius:8px}
</style>
</head>

<script>
// <PURE>
const strip=s=>s.replace(/ñ/g,'\u0001').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\u0001/g,'ñ');
const noTilde=s=>s.replace(/[áéíóú]/g,c=>'aeiou'['áéíóú'.indexOf(c)]);
const hasTilde=s=>/[áéíóú]/.test(s);
function lev(a,b){const n=a.length,m=b.length;let p=Array.from({length:m+1},(_,j)=>j);for(let i=1;i<=n;i++){const c=[i];for(let j=1;j<=m;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[m];}
function charOps(a,b){
  const n=a.length,m=b.length,d=[];
  for(let i=0;i<=n;i++){d[i]=new Array(m+1);d[i][0]=i;}
  for(let j=0;j<=m;j++)d[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  const ops=[];let i=n,j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&d[i][j]===d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){ops.push({k:a[i-1]===b[j-1]?'eq':'sub',c:a[i-1],x:b[j-1],ci:i-1});i--;j--;}
    else if(i>0&&d[i][j]===d[i-1][j]+1){ops.push({k:'del',c:a[i-1],x:'',ci:i-1});i--;}
    else{ops.push({k:'ins',c:'',x:b[j-1],ci:i});j--;}
  }
  return ops.reverse();
}
/* ---- sílabas y acento ---- */
function syllabify(w){
  const ch=[...w],n=ch.length;
  const isV=i=>{const c=ch[i];if(!c)return false;
    if('aeiouáéíóúü'.includes(c)){if(c==='u'&&(ch[i-1]==='q'||(ch[i-1]==='g'&&'eiéí'.includes(ch[i+1]||'#'))))return false;return true;}
    return c==='y'&&i===n-1;};
  const strong=c=>'aeoáéó'.includes(c);
  const joins=(a,b)=>!((strong(a)&&strong(b))||/[íú]/.test(a)||/[íú]/.test(b)||a===b);
  const nuc=[];let i=0;
  while(i<n){if(isV(i)){let e=i;while(e+1<n&&isV(e+1)&&joins(ch[e],ch[e+1]))e++;nuc.push([i,e]);i=e+1;}else i++;}
  if(!nuc.length)return [w];
  const bounds=[0];
  const insep=(f,s)=>(s==='r'&&'pbcgfktd'.includes(f))||(s==='l'&&'pbcgfk'.includes(f));
  for(let k=0;k<nuc.length-1;k++){
    const a=nuc[k][1]+1,b=nuc[k+1][0],units=[];
    for(let p=a;p<b;){const two=ch[p]+(ch[p+1]||'');if(p+1<b&&['ch','ll','rr'].includes(two)){units.push(two);p+=2;}else{units.push(ch[p]);p++;}}
    const u=units.length;let keep;
    if(u<=1)keep=0;else if(u===2)keep=insep(units[0],units[1])?0:1;else keep=insep(units[u-2],units[u-1])?u-2:u-1;
    let len=0;for(let q=0;q<keep;q++)len+=units[q].length;
    bounds.push(a+len);
  }
  bounds.push(n);
  const out=[];for(let k=0;k<bounds.length-1;k++)out.push(ch.slice(bounds[k],bounds[k+1]).join(''));
  return out;
}
function stressInfo(w){

function classifyRR(wcs){

function classifyCZS(wcs){

  if(/sion(es)?$/.test(wcs))ids.push('sion');
  if(/(anza|eza|azo|aza)s?$/.test(wcs))ids.push('z_anza');
  if(/z$/.test(wcs))ids.push('z_fin');
  if(/(ancia|encia)s?$/.test(wcs))ids.push('c_ancia');
  if(/c(er|ir)(se)?$/.test(wcs))ids.push('c_cer');
  if(/(cito|cita|cillo|cilla)s?$/.test(wcs))ids.push('c_cito');
  if(/(oso|osa)s?$/.test(wcs))ids.push('s_oso');
  if(/isim[oa]s?$/.test(wcs))ids.push('s_isimo');
  if(/(esa|isa)s?$/.test(wcs))ids.push('s_esa');
  if(/qu[ei]/.test(wcs))ids.push('qu');
  if(/k/.test(wcs))ids.push('k');

function classifyX(wcs){
  const ids=[];
  if(wcs.includes('x')){
    if(/^extra/.test(wcs))ids.push('x_extra');
    else if(/^ex(pl|pr)/.test(wcs))ids.push('x_pl');
    else if(/^ex/.test(wcs))ids.push('x_ex');

function classifyMN(wcs){

  for(const i of idxOf(wcs,'n'))if(wcs[i+1]==='v'){ids.push('nv');break;}

function classifyTilde(wl){

  if(!hasTilde(wl))return null;
  if(/[aeoáéó][íú]|[íú][aeoáéó]/.test(wl))return {id:'hiato',g:'tilde',text:ruleTextById('hiato')};
  const info=stressInfo(wl);
  if(info.n===1)return null;
  if(info.fe===1)return {id:'ag_con',g:'tilde',text:ruleTextById('ag_con')};
  if(info.fe===2)return {id:'ll_con',g:'tilde',text:ruleTextById('ll_con')};
  if(info.fe>=3)return {id:'esd',g:'tilde',text:ruleTextById('esd')};

function homoHits(wcs){

function scanDictadoTheory(text){

    if(!txt)return;
    let e=map.get(id);if(!e){e={id,g,text:txt,examples:[]};map.set(id,e);}
    if(example&&!e.examples.includes(example)&&e.examples.length<4)e.examples.push(example);
  };

  words.forEach(w=>{

    if(seenWCS.has(wcs))return;

    const hid=classifyH(wcs);if(hid)add(hid,'h',ruleTextById(hid),w.t);
    const bid=classifyB(wcs);if(bid)add(bid,'bv',ruleTextById(bid),w.t);
    const vid=classifyV(wcs);if(vid)add(vid,'bv',ruleTextById(vid),w.t);

    const jid=classifyJ(wcs);if(jid)add(jid,'gj',ruleTextById(jid),w.t);

    const rrid=classifyRR(wcs);if(rrid)add(rrid,'rr',ruleTextById(rrid),w.t);
    classifyCZS(wcs).forEach(id=>add(id,'czs',ruleTextById(id),w.t));

function teoriaHTML(text){

/* ---- resaltar en rojo, letra a letra, lo que cae bajo una regla ortográfica -----------------
   Reutiliza las mismas funciones classify* de arriba (que ya deciden QUÉ regla aplica a cada
   palabra) y además localiza EN QUÉ posición de la palabra está la letra o letras responsables,
   para poder pintarlas de rojo dentro del propio texto del dictado. Solo se marcan reglas de
   ortografía letra a letra (h, b/v, g/j, ll/y, r/rr, c/z/s/qu/k, x, m/n y tildes); mayúsculas y
   confusiones de palabras completas (homófonos) no se pintan letra a letra porque no señalan una
   letra concreta, y ya se explican abajo en la lista de reglas. */
function ruleHighlightSpans(id,wcs){
  const spans=[];
  const all=re=>{re=new RegExp(re,'g');let m;while((m=re.exec(wcs))){spans.push([m.index,m.index+m[0].length]);if(m.index===re.lastIndex)re.lastIndex++;}};
  switch(id){
    case 'h_hue':case 'h_haber':case 'h_hum':case 'h_griego':case 'h_pref':case 'h_gen':all('h');break;
    case 'b_bibl':case 'b_bien':case 'b_aba':case 'b_iba':case 'b_bilidad':case 'b_ble':case 'b_bir':case 'b_ber':case 'b_pref':case 'b_bu':case 'b_bi':case 'b_lr':case 'b_mb':case 'b_cons':case 'b_gen':all('b');break;
    case 'v_ev':case 'v_vice':case 'v_adv':case 'v_nv':case 'v_uv':case 'v_ivo':case 'v_ver':case 'v_gen':all('v');break;
    case 'gu_ei':all('gu[ei]');break;
    case 'g_ger':case 'g_gente':case 'g_geo':case 'g_gia':case 'g_gen':case 'g_ei':case 'g_aou':case 'g_lr':all('g');break;
    case 'j_aje':case 'j_jero':case 'j_dijo':case 'j_aou':case 'j_gen':all('j');break;
    case 'll_illo':case 'll_fam':case 'll_gen':all('ll');break;
    case 'y_pl':case 'y_verb':case 'y_fin':case 'y_gen':all('y');break;
    case 'rr_vv':all('rr');break;
    case 'r_ini':spans.push([0,1]);break;
    case 'r_nls':all('[nls]r');break;
    case 'cc':all('ccion(es)?$');break;
    case 'cion':all('cion(es)?$');break;
    case 'sion':all('sion(es)?$');break;
    case 'z_anza':all('(anza|eza|azo|aza)s?$');break;
    case 'z_fin':all('z$');break;
    case 'c_ancia':all('(ancia|encia)s?$');break;
    case 'c_cer':all('c(er|ir)(se)?$');break;
    case 'c_cito':all('(cito|cita|cillo|cilla)s?$');break;
    case 's_oso':all('(oso|osa)s?$');break;
    case 's_isimo':all('isim[oa]s?$');break;
    case 's_esa':all('(esa|isa)s?$');break;
    case 'qu':all('qu[ei]');break;
    case 'k':all('k');break;
    case 'x_extra':all('^extra');break;
    case 'x_pl':all('^ex(pl|pr)');break;
    case 'x_ex':all('^ex');break;
    case 'x_gen':all('x');break;
    case 's_es':all('^es[ptc]');break;
    case 'mpb':all('m[pb]');break;
    case 'nv':all('nv');break;
  }
  return spans;
}
function mergeSpans(spans){
  spans=spans.filter(s=>s&&s[1]>s[0]).sort((a,b)=>a[0]-b[0]);
  if(!spans.length)return [];
  const out=[spans[0].slice()];
  for(let i=1;i<spans.length;i++){const last=out[out.length-1],cur=spans[i];
    if(cur[0]<=last[1])last[1]=Math.max(last[1],cur[1]);else out.push(cur.slice());}
  return out;
}
/* letras/tramos (en las coordenadas de la propia palabra tal como aparece en el texto, con
   mayúsculas y tildes) que hay que pintar de rojo en esta palabra, o [] si no le toca ninguna
   regla letra a letra. */
/* igual que antes, pero además recuerda QUÉ regla(s) concretas (id + texto) han marcado cada
   tramo, para poder mostrarlas luego si Julia toca la palabra (ver dictadoAffectedWordsHTML). */
function wordRuleInfo(wOrig){
  if(!/\p{L}/u.test(wOrig))return {spans:[],rules:[]};
  const wl=wOrig.toLowerCase(),wcs=strip(wl);
  let spans=[];const rules=[];
  const addRule=(id,text)=>{if(text&&!rules.some(r=>r.id===id))rules.push({id,text});};
  const push=(id,sp)=>{if(sp&&sp.length)spans=spans.concat(sp);addRule(id,ruleTextById(id));};
  const tid=classifyTilde(wl);
  if(tid){const m=wOrig.match(/[áéíóúÁÉÍÓÚ]/);spans.push(m?[m.index,m.index+1]:[0,wOrig.length]);addRule(tid.id,tid.text||ruleTextById(tid.id));}
  if(wl.includes('ü')){const i=wl.indexOf('ü');spans.push([i,i+1]);addRule('dier',ruleTextById('dier'));}
  const hid=classifyH(wcs);if(hid)push(hid,ruleHighlightSpans(hid,wcs));
  const bid=classifyB(wcs);if(bid)push(bid,ruleHighlightSpans(bid,wcs));
  const vid=classifyV(wcs);if(vid)push(vid,ruleHighlightSpans(vid,wcs));
  const gid=classifyG(wcs);if(gid)push(gid,ruleHighlightSpans(gid,wcs));
  const jid=classifyJ(wcs);if(jid)push(jid,ruleHighlightSpans(jid,wcs));
  const llid=classifyLL(wcs);if(llid)push(llid,ruleHighlightSpans(llid,wcs));
  const yid=classifyY(wcs);if(yid)push(yid,ruleHighlightSpans(yid,wcs));
  const rrid=classifyRR(wcs);if(rrid)push(rrid,ruleHighlightSpans(rrid,wcs));
  classifyCZS(wcs).forEach(id=>push(id,ruleHighlightSpans(id,wcs)));
  classifyX(wcs).forEach(id=>push(id,ruleHighlightSpans(id,wcs)));
  classifyMN(wcs).forEach(id=>push(id,ruleHighlightSpans(id,wcs)));
  return {spans:mergeSpans(spans),rules};
}
function wordRuleSpans(wOrig){return wordRuleInfo(wOrig).spans;}
function wordMarkedHTML(wOrig,spans){
  if(!spans.length)return esc(wOrig);
  let html='',p=0;
  spans.forEach(([s,e])=>{html+=esc(wOrig.slice(p,s))+`<span style="color:var(--bad);font-weight:800">${esc(wOrig.slice(s,e))}</span>`;p=e;});
  html+=esc(wOrig.slice(p));
  return html;
}
/* las palabras con regla, dentro del propio texto, son un botón: al pasar el ratón por encima se
   destaca su fondo y aparece debajo un globo con la regla ortográfica que le corresponde (igual
   que las palabras sueltas de la lista de abajo, pero aquí con el ratón en vez de al tocar, para
   no desordenar el texto al abrir/cerrar). */
function wordRuleBtnHTML(wOrig,info){
  const marked=wordMarkedHTML(wOrig,info.spans);
  if(!info.spans.length||!info.rules.length)return marked;
  const tip=info.rules.map(r=>esc(r.text)).join('<br>');
  return `<span class="wrule"><button type="button" class="wrule-btn">${marked}</button><span class="wrule-tip">${tip}</span></span>`;
}
/* el texto completo del dictado, con las letras afectadas ya pintadas de rojo en su sitio */
function dictadoTextHighlightHTML(text){
  text=text||'';
  let words;try{words=getWords(text);}catch(e){return esc(text);}
  let out='',pos=0;
  words.forEach(w=>{
    out+=esc(text.slice(pos,w.i));
    out+=wordRuleBtnHTML(w.t,wordRuleInfo(w.t));
    pos=w.i+w.t.length;
  });
  out+=esc(text.slice(pos));
  return out;
}
/* debajo del texto: solo las palabras afectadas (sin repetir), cada una con sus letras en rojo.
   Son pulsables: al tocar una, debajo de ESA palabra (no de todas) aparece la regla ortográfica
   que le corresponde — se guarda en ui.dictRuleOpen cuál está abierta (por su forma sin tildes,
   que es la misma "key" que ya se usaba para no repetir palabras). */
function dictadoAffectedWordsHTML(text){
  let words;try{words=getWords(text||'');}catch(e){return '';}
  const seen=new Map();
  words.forEach(w=>{
    const key=strip(w.t.toLowerCase());
    if(seen.has(key))return;
    const info=wordRuleInfo(w.t);
    if(!info.spans.length)return;
    seen.set(key,{html:wordMarkedHTML(w.t,info.spans),rules:info.rules});
  });
  if(!seen.size)return '';
  const open=ui.dictRuleOpen;
  const chips=Array.from(seen.entries()).map(([key,v])=>{
    const isOpen=open===key;
    return `<span style="display:inline-flex;flex-direction:column;align-items:flex-start;vertical-align:top">
    <button data-act="dictRuleToggle" data-k="${esc(key)}" style="font:inherit;cursor:pointer;background:${isOpen?'#ece9fb':'#f6f5ff'};border:1px solid ${isOpen?'var(--pri)':'var(--line)'};border-radius:10px;padding:4px 10px;margin:2px">${v.html}</button>
    ${isOpen?`<div class="rule" style="margin:0 2px 8px;max-width:260px;font-size:.88rem;line-height:1.35">${v.rules.map(r=>esc(r.text)).join('<br>')}</div>`:''}
    </span>`;

  return `<div style="margin-top:12px"><b>Palabras con letras que siguen una regla:</b> <small class="mute">(toca una para ver su regla)</small>
  <div style="margin-top:8px;font-size:1.15rem;line-height:2.4;display:flex;flex-wrap:wrap">${chips}</div></div>`;
}

   siempre las mismas dimensiones ya corregidas). Por eso NO se hace ninguna corrección EXIF manual
   aquí -- intentarlo duplicaba la rotación y dejaba las fotos al revés. Nos fiamos del navegador
   para la orientación base y dejamos solo el giro manual (botón "Girar") para el usuario. */
async function jpegFromFile(file,max){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res({url:c.toDataURL('image/jpeg',0.85),w,h});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('No se ha podido abrir la foto'));};
    img.src=url;
  });
}

const EX_STOP=new Set('el la los las un una unos unas de del al y o u en a que se es son por para con sin sobre como su sus lo le les mas muy este esta estos estas cual cuales cuando donde quien cuanto cuantos cuantas the a an of to in on at and or is are was were be by for with from as that this these those which what who whom when where how many much its it their his her'.split(' '));
const exNorm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9ñ\s]/g,' ').replace(/\s+/g,' ').trim();

/* validar y normalizar una pregunta salida de la IA; devuelve null si no vale */
function exClean(raw,src,rng){
  if(!raw||typeof raw!=='object')return null;
  const q=String(raw.q||raw.question||'').trim();if(q.length<8)return null;
  const fact=String(raw.fact||'').trim().slice(0,80),expl=String(raw.e||raw.explanation||'').trim().slice(0,300);
  const v=String(raw.var||raw.caso||'').trim().slice(0,60);
  const isT=raw.t==='test'||Array.isArray(raw.o||raw.options);
  if(isT){
    let o=(raw.o||raw.options||[]).map(x=>String(x).replace(/^\s*[A-Da-d][\).:\-]\s+/,'').trim()).filter(Boolean);
    let c=Number.isInteger(raw.c)?raw.c:Number.isInteger(raw.correct)?raw.correct:-1;
    if(o.length<3||o.length>5||c<0||c>=o.length)return null;
    if(new Set(o.map(exNorm)).size!==o.length)return null;
    if(o.some(x=>x.length>160))return null;
    if(o.some(x=>/todas las anteriores|ninguna de las anteriores|all of the above|none of the above/i.test(x)))return null;
    const ok=o[c],idx=o.map((x,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
    o=idx.map(i=>o[i]);c=o.indexOf(ok);
    return {id:'q'+Math.floor(rng()*1e9).toString(36)+Date.now().toString(36).slice(-3),t:'test',q,o,c,e:expl,fact,v,src,off:false};
  }
  const a=String(raw.a||raw.answer||'').trim();let k=(raw.k||raw.keywords||[]);if(typeof k==='string')k=k.split(/[,;]/);
  k=k.map(x=>String(x).trim()).filter(Boolean).slice(0,6);
  if(a.length<2||!k.length)return null;
  return {id:'q'+Math.floor(rng()*1e9).toString(36)+Date.now().toString(36).slice(-3),t:'red',q,a,k,e:expl,fact,v,src,off:false};
}
/* rescatar preguntas de un JSON posiblemente cortado */
function exParse(text){
  let t=String(text||'').replace(/```[a-z]*/gi,'').trim();
  try{const j=JSON.parse(t);if(Array.isArray(j))return j;if(j&&Array.isArray(j.questions))return j.questions;}catch(e){}
  const i=t.indexOf('['),out=[];if(i<0)return out;
  let depth=0,st=-1,inS=false,esc=false;
  for(let p=t.indexOf('{',i);p<t.length&&p>=0;p++){
    const ch=t[p];
    if(inS){if(esc)esc=false;else if(ch==='\\')esc=true;else if(ch==='"')inS=false;continue;}
    if(ch==='"'){inS=true;continue;}
    if(ch==='{'){if(depth===0)st=p;depth++;}
    else if(ch==='}'){depth--;if(depth===0&&st>=0){try{out.push(JSON.parse(t.slice(st,p+1)));}catch(e){}st=-1;}}
  }
  return out;
}
/* "caso concreto" de una pregunta-plantilla repetible (p.ej. la palabra en "Analiza la palabra
   «X»…", o un verbo, un número...). Preferimos el campo estructurado raw.var/raw.caso (que la IA
   rellena a propósito) y, si no lo trae, buscamos una palabra entre «» o "" en el enunciado como
   respaldo. Estas preguntas de "aplica esta regla a un caso nuevo" son ejercicios de repetición
   por diseño (raíz y morfemas, tipos de verbo, sinónimos…): que se parezcan mucho entre sí es lo
   esperado y NO se deben descartar por eso — solo se descartan si repiten el MISMO caso. */
function exQuotedWord(q){
  const s=String((q&&q.q)||'');
  const m=s.match(/«([^»]{1,40})»/)||s.match(/"([^"]{1,40})"/);
  return m?exNorm(m[1]):'';
}
function exVarKey(q){
  const v=(q&&q.v)?exNorm(q.v):'';
  return v||exQuotedWord(q);
}
/* curar: quita SOLO las que son prácticamente la misma pregunta (texto casi literal) o repiten
   exactamente el mismo caso concreto (la misma palabra/ejemplo en preguntas-plantilla del tipo
   "aplica esta regla a un caso nuevo"). A propósito ya NO se descarta nada por "misma respuesta"
   ni por "mismo dato evaluado": eso estaba tirando muchísimas preguntas legítimas (p.ej. muchas
   palabras distintas que son todas "adverbio de tiempo" comparten respuesta pero son preguntas
   distintas), así que el único criterio real de duplicado es el texto de la pregunta en sí.
   OJO con las preguntas-plantilla (n.w/m.w = caso concreto marcado, p.ej. «ayer» vs «pronto»):
   comparten CASI TODO el texto salvo esa palabra, así que su parecido de texto (Jaccard) sale
   igual de alto que si fueran la misma pregunta, aunque NO lo sean. Por eso, si ambas preguntas
   tienen un caso concreto marcado, la ÚNICA comparación válida es si ese caso es el mismo — nunca
   se comparan por parecido de texto entre sí (eso era lo que seguía tirando la mayoría). */
function exCurate(existing,fresh){
  const kept=existing.filter(q=>!q.off||true).slice(),dropped=[],add=[];
  const info=q=>({qt:exToks(q.q),w:exVarKey(q)});
  const infos=kept.map(info);
  fresh.forEach(q=>{
    const n=info(q);let why='';
    for(let i=0;i<kept.length&&!why;i++){const m=infos[i],p=kept[i];
      if(n.w&&m.w){if(n.w===m.w)why=`Ya se preguntó por lo mismo (${p.v||exQuotedWord(p)}): «${p.q}»`;continue;}
      if(exJac(n.qt,m.qt)>=0.94)why=`Es prácticamente la misma pregunta que: «${p.q}»`;
    }
    if(why)dropped.push({q:q.q,why});else{kept.push(q);infos.push(n);add.push(q);}
  });
  return {add,dropped};
}
/* sorteo de un examen: reparte por trozos de apuntes, mezcla opciones */
function exSample(exam,seed,n){
  const r=seedRng(String(seed)),P=exam.pool.filter(q=>!q.off);
  const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const pick=(list,k)=>{const g={};shuf(list).forEach(q=>(g[q.src]=g[q.src]||[]).push(q));const keys=shuf(Object.keys(g)),out=[];
    while(out.length<k&&keys.some(x=>g[x].length)){for(const x of keys){if(out.length>=k)break;if(g[x].length)out.push(g[x].pop());}}return out;};
  let sel;
  if(exam.mode==='mixto'){const T=P.filter(q=>q.t==='test'),R=P.filter(q=>q.t==='red'),a=Math.ceil(n/2);sel=pick(T,a).concat(pick(R,n-a));
    if(sel.length<n){const have=new Set(sel.map(q=>q.id));sel=sel.concat(pick(P.filter(q=>!have.has(q.id)),n-sel.length));}}
  else sel=pick(P,n);
  return shuf(sel).map(q=>{if(q.t!=='test')return Object.assign({},q);
    const idx=q.o.map((x,i)=>i),ok=q.o[q.c];for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
    const o=idx.map(i=>q.o[i]);return Object.assign({},q,{o,c:o.indexOf(ok)});});
}
/* corrección automática de respuesta redactada por palabras clave */
function exGrade(q,ans){
  const A=exNorm(ans),At=A.split(' ').filter(Boolean);
  if(!A)return {score:0,ok:'ko',hits:[],miss:(q.k||[]).slice()};
  const hits=[],miss=[];
  (q.k||[]).forEach(kw=>{
    const kt=exNorm(kw).split(' ').filter(Boolean);
    const has=w=>At.some(x=>x===w||exStem(x)===exStem(w)||(w.length>=6&&x.length>=6&&lev(x,w)<=1)||(w.length>=4&&/^\d+$/.test(w)&&x===w));
    (kt.length&&kt.every(has)?hits:miss).push(kw);
  });
  const tot=hits.length+miss.length,score=tot?hits.length/tot:0;
  return {score,ok:score>=0.7?'ok':score>=0.4?'part':'ko',hits,miss};
}
/* ---- "escríbelo tú": cuando Julia falla una pregunta/palabra, antes de poder seguir tiene que
   escribir ella misma la respuesta correcta (no basta con leerla) -- así se refuerza mejor en la
   memoria que simplemente ver la respuesta. Se usa en Estudio de temas, Análisis Morfológico y el
   dictado de Spelling (no en Exámenes, que se corrige al final, ni en Matemáticas).
   textCloseEnough: compara lo que ha escrito con la respuesta correcta -- no hace falta que sea
   una copia exacta carácter a carácter (mayúsculas, tildes o un punto final no cuentan, y se
   admite alguna errata suelta en palabras largas), pero sí que, en conjunto, haya escrito casi
   todas las palabras de la respuesta correcta. */
function textCloseEnough(given,correct){
  const g=exNorm(given),c=exNorm(correct);
  if(!g)return false;
  if(g===c)return true;
  const gw=g.split(' ').filter(Boolean),cw=c.split(' ').filter(Boolean);
  if(!cw.length)return false;
  let hit=0;
  cw.forEach(w=>{if(gw.some(x=>x===w||(w.length>=4&&lev(x,w)<=1)||(w.length>=7&&lev(x,w)<=2)))hit++;});
  return hit/cw.length>=0.85;
}
function exChunks(notes,size=1300){
  const paras=String(notes||'').split(/\n{2,}|\n(?=[A-ZÁÉÍÓÚ#\d])/).map(s=>s.trim()).filter(Boolean),out=[];let cur='';
  paras.forEach(p=>{if(cur&&(cur.length+p.length)>size){out.push(cur);cur='';}cur+=(cur?'\n':'')+p;});
  if(cur)out.push(cur);

function rotateDataUrl(dataUrl,deg){

      const swap=deg===90||deg===270,w=swap?img.height:img.width,h=swap?img.width:img.height;

    const ci=calls%chunks.length;
    onProg&&onProg(`Generando preguntas… ${exam.pool.length-start} de ${target}`);
    let txt;try{txt=await aiText(genPrompt(exam,chunks[ci],ci,chunks.length,6),1500);}catch(e){err=e.message;break;}
    calls++;
    const fresh=exParse(txt).map(x=>exClean(x,ci,rng)).filter(Boolean).filter(q=>exam.mode==='mixto'||q.t===exam.mode);
    const {add,dropped}=exCurate(exam.pool,fresh);
    exam.pool=exam.pool.concat(add);exam.dropped=(exam.dropped||[]).concat(dropped).slice(-40);
    dry=add.length?0:dry+1;save();
  }
  return {added:exam.pool.length-start,calls,err};
}
async function aiGradeWritten(qa){
  const t=await aiText([{role:'system',content:'Eres un profesor que corrige la respuesta de una niña de 10-11 años. Compara con la respuesta modelo: valora si expresa las ideas clave, aunque use otras palabras o tenga faltas de ortografía. Devuelve SOLO JSON: {"score":0 a 1 (puedes usar 0, 0.5 o 1 o valores intermedios),"comment":"una frase en español para el tutor"}.'},
    {role:'user',content:JSON.stringify({pregunta:qa.q,respuesta_modelo:qa.correct,palabras_clave:qa.hits.concat(qa.miss),respuesta_alumna:qa.given})}],400);
  const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error('La IA no devolvió una nota válida');
  const j=JSON.parse(m[0]);const s=Math.max(0,Math.min(1,Number(j.score)));if(!isFinite(s))throw new Error('Nota no válida');
  return {score:s,comment:String(j.comment||'').slice(0,240)};
}

/* Huella digital exacta del archivo (SHA-256 de sus bytes), para detectar por código -sin IA- si
   dos fotos subidas son literalmente el mismo archivo (la misma foto subida dos veces). */
async function fileHash(file){
  try{
    const buf=await file.arrayBuffer();
    const digest=await crypto.subtle.digest('SHA-256',buf);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){return '';}
}
async function readNotesPhotos(files){
  const e=exGet(ui.exId),st=()=>$('#exSt');if(!e)return;
  if(!state.ai.photoOn){if(st())st().textContent='';return toast('Activa la IA de fotos en Ajustes para leer fotos');}
  const total=files.length;files=files.slice(0,EX_MAXPH);
  const gallery=state.examFotos[e.id]=(state.examFotos[e.id]||[]);
  const out=[];let okN=0,errN=0,dupN=0;
  const seenHashes=new Set(gallery.map(p=>p.hash).filter(Boolean));
  for(let i=0;i<files.length;i++){
    const hash=await fileHash(files[i]);
    if(hash&&seenHashes.has(hash)){dupN++;continue;}
    if(hash)seenHashes.add(hash);
    if(st())st().innerHTML=`🔎 Leyendo la foto ${i+1} de ${files.length}…`;
    const entry={id:uid(),thumb:'',full:'',text:'',err:'',rot:0,hash,name:files[i].name||''};
    try{
      const info=await fileToJpegInfo(files[i],1800),thumb=await fileToJpeg(files[i],260);
      entry.full=info.url;entry.thumb=thumb;
      const [rot,text]=await Promise.all([detectPhotoRot(entry.full).catch(()=>0),readNotesPhoto(entry.full)]);
      entry.rot=rot;entry.text=text;out.push(text);okN++;
    }catch(er){entry.err=er.message;errN++;}
    gallery.push(entry);
  }
  state.examFotos[e.id]=gallery.slice(-40);
  if(out.length){e.notes=(e.notes.trim()?e.notes.trim()+'\n\n':'')+out.join('\n\n');const ta=$('[data-exf=notes]');if(ta)ta.value=e.notes;}
  save();
  const y=scrollY;render();scrollTo(0,y);
  const s2=$('#exSt');
  if(s2){
    let msg=okN?`✅ <b>${okN} ${okN===1?'foto leída':'fotos leídas'}.</b> Revisa el texto por si la IA se ha equivocado y luego pulsa «Generar preguntas».`:'';
    if(dupN)msg+=(msg?' ':'')+`♻️ ${dupN} ${dupN===1?'foto estaba repetida (ya la tenías subida) y no se ha vuelto a contar':'fotos estaban repetidas (ya las tenías subidas) y no se han vuelto a contar'}.`;
    if(errN)msg+=(msg?' ':'')+`⚠️ ${errN} ${errN===1?'foto no se pudo leer':'fotos no se pudieron leer'} (toca su miniatura para ver el motivo).`;
    if(total>EX_MAXPH)msg+=` <br><small>Has subido ${total}; solo se procesan ${EX_MAXPH} de golpe. Sube el resto en otra tanda: se añadirá a lo que ya tienes.</small>`;
    if(!msg)msg='Esa foto ya estaba subida, no se ha vuelto a añadir.';
    s2.innerHTML=msg;
  }
}

function startExam(eid,itemId){
  const e=exGet(eid);if(!e||e.status!=='ready')return toast('Este examen todavía no está disponible');
  const n=Math.min(e.n,e.pool.filter(q=>!q.off).length),qs=exSample(e,'x'+Date.now()+eid,n);

}

/* ================= temas de teoría: modo estudio (con/sin foto) ================= */
function ruleTextOfQ(q){
  const t=(q.e||'').trim();if(t)return t;
  const ans=q.t==='test'?q.o[q.c]:q.a;
  return (q.fact?q.fact+': ':'')+ans;
}
function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* 3 opciones de "regla/explicación" para cuando Julia falla una pregunta: la correcta (de esta
   pregunta) y 2 señuelos sacados de otras preguntas del mismo tema. Igual que las 3 opciones del
   dictado, pero aplicado a las preguntas de teoría. */
function makeExamOptions(pool,q){
  const correct=ruleTextOfQ(q);
  const others=shuffleArr(pool.filter(o=>o.id!==q.id&&!o.off));
  const picks=[];
  for(const o of others){const t=ruleTextOfQ(o);if(t&&t!==correct&&!picks.some(p=>p.text===t)){picks.push({text:t,ok:false});}if(picks.length>=2)break;}
  return shuffleArr([{text:correct,ok:true},...picks]);
}
/* progreso de una ronda de estudio: se guarda el orden de preguntas (por id), en qué
   pregunta va y sus aciertos, para que si Julia sale (o cierra el navegador) a medias,
   al volver a abrir el mismo tema retome exactamente en la misma pregunta donde lo dejó. */
function studySave(){
  const st=ui.study;if(!st)return;
  state.studyProgress=state.studyProgress||{};
  /* hwN/hwMode: con qué nº de preguntas y modo se armó esta ronda (null/'estudio' si es de
     práctica libre, ver studyOpen). studyOpenHomework los compara con lo que pide el deber antes
     de retomar una ronda a medias: si el tutor cambió el nº de preguntas o el modo para un nuevo
     deber sobre la misma tarjeta, no tiene sentido seguir retomando la ronda vieja con la
     configuración vieja. */
  state.studyProgress[st.temaId]={i:st.i,firstOk:st.firstOk,level:st.level,showPhoto:st.showPhoto,order:st.qs.map(q=>q.id),hwN:st.hwN!==undefined?st.hwN:null,hwMode:st.hwMode||null};
  save();
}
function studyClearProgress(temaId){
  if(state.studyProgress&&state.studyProgress[temaId]){delete state.studyProgress[temaId];save();}
}
function studyOpen(id){
  const e=exGet(id);if(!e||e.status!=='ready')return toast('Este tema todavía no está disponible');
  const pool=e.pool.filter(q=>!q.off);if(!pool.length)return toast('Este tema no tiene preguntas todavía');
  const saved=state.studyProgress&&state.studyProgress[id];
  let qs=null,i=0,firstOk=0,level=1,showPhoto=true;
  if(saved&&Array.isArray(saved.order)&&saved.i<saved.order.length){
    const byId={};pool.forEach(q=>byId[q.id]=q);
    const ordered=saved.order.map(qid=>byId[qid]).filter(Boolean);
    const extra=pool.filter(q=>!saved.order.includes(q.id));
    const rebuilt=ordered.concat(extra);
    if(rebuilt.length){qs=rebuilt;i=Math.min(saved.i,qs.length-1);firstOk=saved.firstOk||0;level=saved.level||1;showPhoto=saved.showPhoto!==undefined?saved.showPhoto:true;}
  }
  if(!qs)qs=shuffleArr(pool);
  /* theoryOpen empieza abierto en Nivel 1 (con foto) y PLEGADO en Nivel 2 (sin foto): David quiere
     que Julia pueda ver la foto también en Nivel 2 si se atasca, pero que no salga ya abierta de
     golpe, para no quitarle del todo el reto de intentar recordar primero (ver studyTheoryOrWarn). */
  ui.study={temaId:id,level,showPhoto,qs,i,stage:'answer',picked:null,given:'',opts:null,wrongPicks:[],writeGiven:'',writeOk:false,writeDiff:null,firstOk,n:qs.length,recorded:false,theoryOpen:showPhoto};
  ui.studyPhotoView=null;ui.studyQuitAsk=false;ui.screen='study';studySave();render();
}
/* ---- nº de preguntas y rotación cuando la teoría se pone como DEBER del día ----
   El propio tutor elige, al poner la tarjeta como deber (en "Agregar a deberes", ver
   taskAddOverlay en p4t.js), cuántas preguntas le tocan a Julia ese día (it.n: puede ser "todas"
   -null/0/undefined- o un número concreto). No hay ningún tope automático. Cuando el tutor pide
   MENOS preguntas de las que tiene el banco, para que repartido en varios días/deberes acabe
   pasando por el máximo número posible de preguntas distintas (en vez de que le toquen siempre
   las mismas al azar), se recuerda qué preguntas ya le han tocado como deber en este tema
   (state.studyHist, que NO se borra al terminar una ronda a diferencia de studyProgress) y cada
   vez se eligen preferentemente las que todavía no le han tocado. Cuando ya se han usado todas, se
   considera agotado el banco y se vuelve a barajar desde cero (un ciclo nuevo). Si el tutor pide
   "todas" (o pide tantas o más de las que hay), no hace falta rotación: le tocan todas, como
   siempre. */
function studyPickHomeworkSet(id,pool,n){
  if(!n||n>=pool.length)return shuffleArr(pool);
  state.studyHist=state.studyHist||{};
  const prev=state.studyHist[id];
  let usedSet=new Set((prev&&Array.isArray(prev.used)?prev.used:[]).filter(qid=>pool.some(q=>q.id===qid)));
  let unused=pool.filter(q=>!usedSet.has(q.id));
  if(!unused.length){usedSet=new Set();unused=pool.slice();} // banco agotado: ciclo nuevo
  const picked=shuffleArr(unused).slice(0,n);
  picked.forEach(q=>usedSet.add(q.id));
  if(usedSet.size>=pool.length)usedSet=new Set(); // con este deber se completa el ciclo: la próxima vez, a barajar de nuevo
  state.studyHist[id]={used:Array.from(usedSet)};
  save();
  return shuffleArr(picked);
}
/* mode: 'estudio' (nivel 1, con foto -por defecto-) o 'examen' (nivel 2, sin foto), elegido por el
   tutor al poner la tarjeta como deber (it.mode). */
function studyOpenHomework(id,n,mode){
  const e=exGet(id);if(!e||e.status!=='ready')return toast('Este tema todavía no está disponible');
  const pool=e.pool.filter(q=>!q.off);if(!pool.length)return toast('Este tema no tiene preguntas todavía');
  const nReq=n||null,modeReq=mode==='examen'?'examen':'estudio';
  const saved=state.studyProgress&&state.studyProgress[id];
  /* solo se retoma una ronda a medias si es EXACTAMENTE el mismo deber (mismo nº de preguntas y
     mismo modo) que se dejó a medias: si el tutor puso un deber nuevo sobre esta misma tarjeta
     con otro nº de preguntas u otro modo, se descarta lo que hubiera a medias y se sortea un set
     nuevo con la configuración de ESTE deber (ver studySave: hwN/hwMode). */
  const sameHw=saved&&(saved.hwN||null)===nReq&&(saved.hwMode||null)===modeReq;
  if(sameHw&&Array.isArray(saved.order)&&saved.i<saved.order.length){
    const byId={};pool.forEach(q=>byId[q.id]=q);
    const ordered=saved.order.map(qid=>byId[qid]).filter(Boolean);
    // si alguna de las preguntas originales ya no está activa, se rellena con otras del banco que
    // todavía no se hubieran usado en esta ronda, igual que hace studyOpen, sin pasarse del nº de
    // preguntas que pidió este deber (nReq) cuando lo pidió.
    const extra=pool.filter(q=>!saved.order.includes(q.id));
    let rebuilt=ordered.concat(extra);
    if(nReq&&rebuilt.length>nReq)rebuilt=rebuilt.slice(0,nReq);
    if(rebuilt.length){
      const showPhoto2=saved.showPhoto!==undefined?saved.showPhoto:true;
      ui.study={temaId:id,level:saved.level||1,showPhoto:showPhoto2,qs:rebuilt,i:Math.min(saved.i,rebuilt.length-1),stage:'answer',picked:null,given:'',opts:null,wrongPicks:[],writeGiven:'',writeOk:false,writeDiff:null,firstOk:saved.firstOk||0,n:rebuilt.length,recorded:false,theoryOpen:showPhoto2,hwN:nReq,hwMode:modeReq};
      ui.studyPhotoView=null;ui.studyQuitAsk=false;ui.screen='study';studySave();render();return;
    }
  }
  const qs=studyPickHomeworkSet(id,pool,n);
  const level=modeReq==='examen'?2:1,showPhoto=level===1;
  ui.study={temaId:id,level,showPhoto,qs,i:0,stage:'answer',picked:null,given:'',opts:null,wrongPicks:[],writeGiven:'',writeOk:false,writeDiff:null,firstOk:0,n:qs.length,recorded:false,theoryOpen:showPhoto,hwN:nReq,hwMode:modeReq};
  ui.studyPhotoView=null;ui.studyQuitAsk=false;ui.screen='study';studySave();render();
}
function studyRound(temaId,level,showPhoto){
  const e=exGet(temaId),pool=e.pool.filter(q=>!q.off);
  ui.study={temaId,level,showPhoto,qs:shuffleArr(pool),i:0,stage:'answer',picked:null,given:'',opts:null,wrongPicks:[],writeGiven:'',writeOk:false,writeDiff:null,firstOk:0,n:pool.length,recorded:false,theoryOpen:showPhoto};
  ui.studyPhotoView=null;ui.studyQuitAsk=false;studySave();render();
}

/* fotos de teoría y texto transcrito, juntos en un único bloque plegable con un solo botón: así
   Julia puede ver la foto de los apuntes en el ordenador (hace falta cuando la IA pregunta sobre
   un dibujo o esquema de la foto y no está su tutor al lado con el cuaderno real delante) y, si
   quiere hacer más sitio en la pantalla, minimizar las fotos y el texto juntos de una vez. Empieza
   siempre abierto, para que nunca falte la foto por defecto; Julia puede plegarlo a mano y eso se
   respeta el resto de la ronda (ver ui.study.theoryOpen). Si a este tema no le queda ni foto ni
   texto (p.ej. se borró la foto después de generar las preguntas, lo que también borra su trozo de
   apuntes), avisamos con claridad de qué falta en vez de dejarlo en blanco. */

     quiere que, si se atasca, pueda igualmente ver la foto y el texto, así que la etiqueta del
     botón lo deja claro en vez de parecer que no hay nada que ver. */
  const label=(st&&st.showPhoto===false)?'🙈 ¿Te atascas? Ver fotos y teoría':'📖 Ver fotos y teoría';

function studyAnswerHTML(st,q){
  if(st.stage==='answer'){
    let body;
    if(q.t==='test'){
      body=q.o.map((o,k)=>`<button class="item" style="display:block;width:100%;text-align:left;font:inherit;background:${st.picked===k?'#ece9fb':'#fff'};border:2px solid ${st.picked===k?'var(--pri)':'var(--line)'};border-radius:var(--r);padding:14px 16px;margin:8px 0;cursor:pointer;color:var(--ink)" data-act="studyPick" data-k="${k}"><b style="color:var(--pri2)">${'ABCDE'[k]}.</b> ${esc(o)}</button>`).join('');
      body+=`<div class="row" style="margin-top:8px"><button class="btn primary big" data-act="studyCheck" ${st.picked==null?'disabled':''}>✔ Comprobar</button></div>`;
    }else{
      body=`<textarea id="studyAns" data-enter="studyAns" placeholder="Escribe tu respuesta…" autocomplete="off" autocorrect="off" spellcheck="false" style="min-height:110px" ${st.checking?'disabled':''}>${esc(st.given||'')}</textarea><div class="row" style="margin-top:8px"><button class="btn primary big" data-act="studyCheck" ${st.checking?'disabled':''}>${st.checking?'⏳ Corrigiendo…':'✔ Comprobar'}</button></div>`;
    }
    return body;
  }
  if(st.stage==='ok')return `<div class="msg right" style="font-size:1.1rem">✅ ¡Correcto!</div>${q.e?`<div class="mute" style="margin-top:6px">💡 ${esc(q.e)}</div>`:''}<div class="row" style="margin-top:12px"><button class="btn success big" data-act="studyNext">Siguiente ➜</button></div>`;
  if(st.stage==='rule'||st.stage==='ruleok'){
    const given=q.t==='test'?(st.picked!=null?q.o[st.picked]:'(sin contestar)'):(st.given||'(sin contestar)');
    /* OJO (arreglado 2026-10-22, aviso de David con foto): aquí había que usar ruleTextOfQ(q) --
       igual que hace makeExamOptions para construir la opción "correcta" de abajo -- y NO la
       fórmula corta q.t==='test'?q.o[q.c]:q.a. Si la pregunta tiene "explicación" propia (q.e) o
       un "fact" (q.fact+': '+respuesta), esa fórmula corta se queda con un texto MÁS BREVE que el
       que de verdad se muestra como opción correcta más abajo (y que Julia copia en "escríbelo
       tú"): p.ej. "Sin límites y con máxima autoridad" (q.o[q.c]) frente a la explicación completa
       "Los reyes tenían poderes sin límites y la máxima autoridad en todas sus áreas de dominio."
       (q.e) -- con palabras distintas entre sí ("con" vs "y la"). Julia copiaba LITERALMENTE la
       explicación completa (la que ve resaltada) y el corrector comparaba contra la frase corta,
       así que por mucho que la copiara bien nunca llegaba al 85% de palabras coincidentes. Mismo
       patrón de fallo que el de Morfología (nivel/subtipo) corregido antes en esta sesión: dos
       sitios construían el "texto correcto" de formas distintas en vez de compartir una única
       función. Usando ruleTextOfQ(q) en los dos sitios (aquí y en studyWriteCheck) quedan
       garantizados iguales, porque es la MISMA función que ya usa makeExamOptions para la opción
       verde de abajo. */
    const correct=ruleTextOfQ(q);
    let h=`<div class="msg wrong">Pusiste: ${esc(given)}</div><div class="msg">La respuesta correcta era: <b>${esc(correct)}</b></div><div class="msg" style="margin-top:8px">📘 ¿Cuál es la explicación correcta?</div>`;
    h+=`<div class="opts">${st.opts.map((o,k)=>`<button data-act="studyRulePick" data-k="${k}" class="${st.wrongPicks.includes(k)?'no':st.stage==='ruleok'&&o.ok?'yes':''}" ${st.wrongPicks.includes(k)||st.stage==='ruleok'?'disabled':''}>${esc(o.text)}</button>`).join('')}</div>`;
    if(st.wrongPicks.length&&st.stage==='rule')h+=`<div class="msg wrong">Casi… prueba con otra.</div>`;
    /* tras acertar la explicación, antes de poder seguir Julia tiene que escribir ella misma la
       respuesta correcta (no basta con haberla leído arriba) -- ver textCloseEnough (p5a.js). Si
       falla, se muestra -- pedido por David (2026-10-22), igual que ya hace Dictado/Morfología --
       qué palabras concretas están mal en rojo (ver morfoWriteDiff/morfoWriteDiffHTML, p5c.js:
       funciones genéricas, no específicas de Morfología, reutilizadas aquí tal cual). */
    if(st.stage==='ruleok'){
      if(!st.writeOk){
        h+=`<div class="panel" style="border-color:var(--pri);background:#f1e9ff;margin-top:10px">
        <b>✍️ Para continuar, escribe tú la respuesta correcta:</b>
        <textarea id="studyWriteAns" data-enter="studyWriteAns" placeholder="Escribe aquí la respuesta correcta…" autocomplete="off" autocorrect="off" spellcheck="false" style="min-height:70px;margin-top:8px">${esc(st.writeGiven||'')}</textarea>
        <div class="row" style="margin-top:8px"><button class="btn primary big" data-act="studyWriteCheck">✔ Comprobar</button></div>
        ${st.writeDiff?morfoWriteDiffHTML(st.writeDiff):''}
        </div>`;
      }else{
        h+=`<div class="msg right" style="margin-top:10px">✅ ¡Muy bien escrita!</div><div class="row" style="margin-top:12px"><button class="btn success big" data-act="studyNext">Siguiente ➜</button></div>`;
      }
    }
    return h;
  }
  return '';
}

/* ARREGLADO (aviso de David, 2026-10-22): "deben salir en TODOS los ejercicios según la frecuencia
   del tutor, porque no están saliendo ahora mismo". Antes solo salía un minijuego si "count" caía
   EXACTAMENTE en un múltiplo de la frecuencia (state.miniGameEvery, 15 por defecto) Y ese múltiplo
   era menor que el total de preguntas/palabras de la ronda -- es decir, si la ronda tenía MENOS
   elementos que la frecuencia (p.ej. Matemáticas por defecto pone 5 o 10 ejercicios, y 10 de los 12

   a llegar a un múltiplo), aun así sale un minijuego una vez, a mitad de ronda, para que ninguna
   ronda se quede sin ninguno. */
function miniGameDue(count,total){
  const ev=state.miniGameEvery||15;
  if(count<=0||count>=total)return false;
  if(total>ev)return count%ev===0;
  return count===Math.max(1,Math.floor(total/2));
}
function miniClearTimer(g){if(g&&g.timer){clearInterval(g.timer);g.timer=null;}}
function startMiniGame(returnScreen,forceKind){

  const makers={memoria:makeMemoriaState,ahorcado:makeAhorcadoState,tres:makeTresState,caza:makeCazaState,puzzle:makePuzzleState,simon:makeSimonState};
  ui.mgame=Object.assign(makers[kind](),{kind,returnScreen});
  if(!ui.mgame.t0)ui.mgame.t0=Date.now();
  ui.screen='minigame';

}

function miniIsDone(g){return g.kind==='memoria'?g.cards.every(c=>c.done):!!g.done;}
/* una frase corta con el resultado, para el historial de actividad del tutor */
function miniResultLine(g){
  switch(g.kind){
    case 'memoria':return `Completado en ${g.moves} movimientos`;
    case 'ahorcado':return g.done==='won'?`Acertó la palabra «${g.word}» (${g.fails} fallo${g.fails===1?'':'s'})`:`No acertó la palabra «${g.word}» (se quedó sin intentos)`;
    case 'tres':return g.done==='p'?'Ganó la partida':g.done==='draw'?'Empate':'Perdió la partida';
    case 'caza':return `${g.score} de ${g.total} aciertos`;
    case 'puzzle':return g.done===true?`Resuelto en ${g.moves} movimientos`:'No lo terminó a tiempo';
    case 'simon':return g.done==='won'?`Completó las ${g.maxRound} rondas`:`Llegó a la ronda ${g.round} de ${g.maxRound}`;
    default:return '';

}

/* ---- tres en raya ---- */
function makeTresState(){return {board:Array(9).fill(null),done:null};}
function ticWinner(b){
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const [a,b1,c] of L)if(b[a]&&b[a]===b[b1]&&b[a]===b[c])return b[a];
  return b.every(Boolean)?'draw':null;
}
function ticAIMove(b){
  const me='o',opp='p';
  const tryWin=mark=>{for(let i=0;i<9;i++){if(!b[i]){const t=b.slice();t[i]=mark;if(ticWinner(t)===mark)return i;}}return -1;};
  let m=tryWin(me);if(m<0)m=tryWin(opp);
  if(m<0&&!b[4])m=4;
  if(m<0){const corners=[0,2,6,8].filter(i=>!b[i]);if(corners.length)m=corners[Math.floor(Math.random()*corners.length)];}
  if(m<0){const free=b.map((v,i)=>v?null:i).filter(v=>v!==null);m=free[Math.floor(Math.random()*free.length)];}
  return m;
}

/* ---- rompecabezas deslizante ---- */
function puzzleNeighbors(i){
  const r=Math.floor(i/3),c=i%3,out=[];
  if(r>0)out.push(i-3);if(r<2)out.push(i+3);if(c>0)out.push(i-1);if(c<2)out.push(i+1);
  return out;
}
function puzzleSolved(t){for(let i=0;i<8;i++)if(t[i]!==i+1)return false;return t[8]===null;}
function makePuzzleState(){
  let tiles=[1,2,3,4,5,6,7,8,null],blank=8;
  for(let k=0;k<120;k++){
    const moves=puzzleNeighbors(blank),m=moves[Math.floor(Math.random()*moves.length)];
    [tiles[blank],tiles[m]]=[tiles[m],tiles[blank]];blank=m;
  }
  return {tiles,moves:0,done:puzzleSolved(tiles),t0:Date.now(),maxMoves:100,maxMs:4*60*1000,timer:null};
}
function puzzleTick(){
  const g=ui.mgame;if(!g||g.kind!=='puzzle'||g.done)return;

    else{g.busy=true;render();setTimeout(()=>{a.open=false;bb.open=false;g.picked=[];g.busy=false;render();},900);}
  },
  miniLetter(b){
    const g=ui.mgame;if(!g||g.kind!=='ahorcado'||g.done)return;
    const l=b.dataset.l;if(g.guessed.includes(l))return;
    g.guessed.push(l);
    if(!g.word.includes(l)){g.fails++;if(g.fails>=g.maxFails)g.done='lost';}
    else if(g.word.split('').every(ch=>g.guessed.includes(ch)))g.done='won';
    render();
  },
  miniTic(b){
    const g=ui.mgame;if(!g||g.kind!=='tres'||g.done)return;
    const i=+b.dataset.i;if(g.board[i])return;
    g.board[i]='p';
    const w=ticWinner(g.board);
    if(w){g.done=w;render();return;}
    render();
    setTimeout(()=>{
      const g2=ui.mgame;if(!g2||g2.kind!=='tres'||g2.done)return;
      const m=ticAIMove(g2.board);if(m>=0)g2.board[m]='o';
      const w2=ticWinner(g2.board);if(w2)g2.done=w2;

  },
  miniCaza(b){

    cazaAdvance(g,+b.dataset.v===g.q.ans);
  },
  miniPuzzle(b){
    const g=ui.mgame;if(!g||g.kind!=='puzzle'||g.done)return;
    const i=+b.dataset.i,blank=g.tiles.indexOf(null);
    if(!puzzleNeighbors(blank).includes(i))return;
    [g.tiles[blank],g.tiles[i]]=[g.tiles[i],g.tiles[blank]];
    g.moves++;

  /* al pulsar un color, se destaca igual que cuando Simón "enseña" la secuencia (mismo g.active,

     acertó, para que Julia vea que su pulsación se ha registrado. Se bloquea la entrada mientras
     dura el flash para evitar pulsaciones dobles. */
  miniSimon(b){
    const g=ui.mgame;if(!g||g.kind!=='simon'||!g.input||g.done)return;
    const c=b.dataset.c;

      g2.active=null;
      if(c!==g2.seq[g2.pos]){g2.done='lost';render();return;}
      g2.pos++;
      if(g2.pos>=g2.seq.length){
        if(g2.round>=g2.maxRound){g2.done='won';render();return;}
        render();
        setTimeout(()=>{const g3=ui.mgame;if(!g3||g3.kind!=='simon')return;simonNextRound(g3);},500);
      }else{g2.input=true;render();}
    },220);
  },
  miniDone(){endMiniGame();},
  miniPreview(b){
    const kind=b.dataset.kind;if(!MINI_KINDS.includes(kind))return;
    ui.mgPreviewReturnTab=ui.tab||'ajustes';

  }
};

function morfoSubLabel(cat,subKey){const list=MORFO_SUBTYPES[cat];if(!list||!subKey)return '';const f=list.find(x=>x.k===subKey);return f?f.l:'';}

   que escribe Julia cuando falla una palabra (ver morfoWriteCheck): "Adverbio" en nivel 1,
   "Adverbio de tiempo" en nivel 2. */
function morfoExpectedLabel(cat,subKey){

/* corrección de "escríbelo tú" en Análisis Morfológico: a diferencia de textCloseEnough (p5a.js,
   que tolera alguna errata suelta, usada en Estudio de temas), aquí NO se tolera ninguna falta de
   ortografía -- cada palabra de la respuesta correcta tiene que estar bien escrita en lo que ha
   puesto Julia (mayúsculas y tildes no cuentan, pero el resto de letras sí). A diferencia de la
   versión anterior (morfoWriteGrade, que solo decía qué palabras faltaban), esta compara palabra
   por palabra lo que ha escrito Julia contra la respuesta esperada, para poder MARCAR en rojo
   (estilo Word) justo la palabra suya que está mal, no solo nombrarla en un aviso: cada palabra
   que escribe se empareja con la palabra esperada más parecida que quede libre (exacta primero,
   luego una errata cercana con la misma tolerancia que textCloseEnough); si no encaja con ninguna,
   se marca mal escrita tal cual. Las palabras esperadas que ninguna palabra suya intenta siquiera
   quedan aparte, como "te falta escribir" (no hay nada que subrayar, porque no las escribió). */
function morfoWordsClose(a,b){
  if(a===b)return true;
  const L=Math.max(a.length,b.length);
  if(L>=7)return lev(a,b)<=2;
  if(L>=4)return lev(a,b)<=1;
  return false;
}
function morfoWriteDiff(given,expectedText){
  const expPool=expectedText.split(/\s+/).filter(Boolean).map(w=>({orig:w,n:exNorm(w),used:false})).filter(e=>e.n);
  const givenWords=given.split(/\s+/).filter(Boolean);
  const results=givenWords.map(w=>{
    const n=exNorm(w);
    if(!n)return {w,bad:false};
    let m=expPool.find(e=>!e.used&&e.n===n);
    if(m){m.used=true;return {w,bad:false};}
    m=expPool.find(e=>!e.used&&morfoWordsClose(e.n,n));
    if(m){m.used=true;return {w,bad:true};}
    return {w,bad:true};
  });
  const missing=[...new Set(expPool.filter(e=>!e.used).map(e=>e.orig.replace(/^[^\p{L}]+|[^\p{L}]+$/gu,'')).filter(Boolean))];
  return {ok:missing.length===0&&results.every(r=>!r.bad),results,missing};
}
/* la explicación de "por qué" es esa categoría/subtipo: la del subtipo si lo hay (más concreta,
   p.ej. adjetivo calificativo -> "Expresa una cualidad del sustantivo."), si no la de la
   categoría general. Se usa tanto en la respuesta del ejercicio ("Es adjetivo calificativo,
   porque expresa...") como podría reutilizarse en otros sitios. */
function morfoWhy(cat,subKey){
  const list=MORFO_SUBTYPES[cat];
  if(subKey&&list){const f=list.find(x=>x.k===subKey);if(f&&f.d)return f.d;}
  return MORFO_THEORY[cat]||'';
}
const lcFirst=s=>s?s.charAt(0).toLowerCase()+s.slice(1):s;
const stripDot=s=>String(s||'').replace(/\.\s*$/,'');
function morfoTheoryText(k){
  let t=MORFO_THEORY[k]||'';

  if(subs&&subs.length)t+=' Tipos: '+subs.map(s=>`${s.l} — ${s.d}`).join(' · ')+'.';

}
/* nivel 1 (como hasta ahora): las opciones de respuesta son solo las categorías generales. Nivel
   2: para las categorías que tienen subtipos (pronombre, adverbio, adjetivo) hay que acertar
   también el subtipo exacto, así que las opciones se "aplanan" para incluir cada subtipo por
   separado ("Adverbio de tiempo", "Adverbio de lugar"...) en vez de una sola opción "Adverbio". */
function morfoOptions(nivel){
  if(nivel!==2)return MORFO_CATS.map(c=>({cat:c.k,sub:'',l:c.l}));
  const out=[];
  MORFO_CATS.forEach(c=>{
    const subs=MORFO_SUBTYPES[c.k];
    if(subs&&subs.length)subs.forEach(s=>out.push({cat:c.k,sub:s.k,l:`${c.l} ${s.l.toLowerCase()}`}));
    else out.push({cat:c.k,sub:'',l:c.l});
  });

}
/* extraIdx: índices (0-based) de las palabras que caen "cada 5 palabras" (1 de cada
   MORFO_EXTRA_EVERY), para las que además de categoría/subtipo se pide separar raíz y morfemas. */
function morfoExtraIdx(tokens){return tokens.map((_,i)=>i).filter(i=>(i+1)%MORFO_EXTRA_EVERY===0);}
function morfoPrompt(text,tokens,extraIdx){
  const list=tokens.map((w,i)=>`${i}: "${w.t}"`).join('\n');
  const morfPart=extraIdx.length?` Además, SOLO para estas palabras en concreto, por su índice: ${extraIdx.join(', ')}, sepáralas también en su RAÍZ (o lexema: la parte invariable que lleva el significado principal) y sus MORFEMAS (los trocitos que se añaden a la raíz), indicando de cada morfema si es "flexivo" (cambia género, número, persona o tiempo, sin crear una palabra nueva: p.ej. "gato" → raíz "gat" + morfemas "o" y, en plural, "s") o "derivativo" (crea una palabra nueva o matiza su significado: p.ej. "panadero" → raíz "pan" + morfema derivativo "adero"). Si una de esas palabras no tiene morfemas (es invariable, o muy corta para dividirse), pon la palabra entera como raíz y una lista de morfemas vacía. Para esas palabras añade un campo "morf", un objeto cuyas claves son esos índices en texto: {"morf":{"${extraIdx[0]}":{"raiz":"...","morfemas":[{"t":"...","tipo":"flexivo"}]}}}.`:'';
  return [{role:'system',content:`Eres un profesor de Lengua de primaria (Year 6, 10-11 años, colegio británico) que clasifica morfológicamente cada palabra de un texto en español. Para cada palabra de la lista, usando el contexto del texto completo, decide su categoría gramatical más apropiada para ese nivel. Usa EXCLUSIVAMENTE una de estas categorías (en minúsculas, tal cual, sin acentos): sustantivo, verbo, adjetivo, adverbio, articulo, pronombre, preposicion, conjuncion. Incluso para números, interjecciones o palabras dudosas, elige siempre la categoría de esta lista que más se le parezca; nunca dejes una palabra sin clasificar. Además, SOLO cuando la categoría sea "pronombre", "adverbio" o "adjetivo", decide también un SUBTIPO (para las demás categorías el subtipo es siempre "" vacío):
- Si es "pronombre", el subtipo es uno de: personal, posesivo, demostrativo, indefinido, numeral, relativo, interrogativo
- Si es "adverbio", el subtipo es uno de: tiempo, lugar, modo, cantidad, afirmacion, negacion, duda
- Si es "adjetivo", el subtipo es uno de: calificativo, demostrativo, posesivo, numeral, indefinido
${morfPart}
Devuelve SOLO un JSON válido: {"cats":["categoria0",...],"subs":["subtipo0",...]${extraIdx.length?',"morf":{...}':''}} con "cats" y "subs" con EXACTAMENTE ${tokens.length} elementos cada uno, en el mismo orden que la lista de palabras, uno por palabra — nunca añadas ni quites elementos.`},
   {role:'user',content:`TEXTO completo (para el contexto):\n"""\n${text}\n"""\n\nPALABRAS a clasificar, en este orden:\n${list}`}];
}
async function morfoAnalyze(text){
  const tokens=getWords(text).slice(0,220);
  if(!tokens.length)throw new Error('No hay palabras que analizar en este texto');
  const extraIdx=morfoExtraIdx(tokens);
  const raw=await aiText(morfoPrompt(text,tokens,extraIdx),Math.min(2600,250+tokens.length*16+extraIdx.length*40));
  const m=raw.match(/\{[\s\S]*\}/);if(!m)throw new Error('La IA no ha devuelto una clasificación válida');
  let j;try{j=JSON.parse(m[0]);}catch(e){throw new Error('La IA no ha devuelto una clasificación válida');}
  if(!Array.isArray(j.cats))throw new Error('La IA no ha devuelto una clasificación válida');
  const cats=tokens.map((_,i)=>MORFO_SET.has(j.cats[i])?j.cats[i]:'sustantivo');
  const subsRaw=Array.isArray(j.subs)?j.subs:[];
  const subs=tokens.map((_,i)=>{
    const cat=cats[i],allowed=MORFO_SUBTYPES[cat];if(!allowed)return '';
    const s=String(subsRaw[i]||'').toLowerCase().trim();
    return allowed.some(x=>x.k===s)?s:'';
  });
  /* "morf": raíz+morfemas de las palabras "cada 5"; si la IA no lo devuelve bien para alguna
     (o para ninguna), simplemente esa palabra se queda sin ese dato extra -- no bloquea nada,
     el análisis en sí (categoría/subtipo) sigue funcionando igual. */
  const morf={};
  extraIdx.forEach(i=>{
    const raw2=j.morf&&j.morf[String(i)];
    if(!raw2||typeof raw2.raiz!=='string'||!Array.isArray(raw2.morfemas))return;
    const raiz=raw2.raiz.trim();if(!raiz)return;
    const morfemas=raw2.morfemas.map(x=>({t:String((x&&x.t)||'').trim(),tipo:(x&&x.tipo)==='derivativo'?'derivativo':'flexivo'})).filter(x=>x.t);
    morf[i]={raiz,morfemas};
  });
  return {tokens,cats,subs,morf};
}

/* rec (opcional): el registro guardado de donde viene el texto (un elemento de state.morfos o

   ningún registro al que agarrarse, así que ese caso sigue analizándose siempre con la IA. Si rec
   ya tiene una clasificación guardada de una vez anterior (morfoCats/morfoSubs/morfoMorf) y
   coincide en número de palabras con el texto actual, se reutiliza esa clasificación en vez de
   volver a llamar a la IA -- así solo se gastan tokens la primera vez que se analiza cada texto,
   no cada vez que Julia (o el tutor) lo abre. Si el tutor edita el texto, saveDict/saveMorfo
   borran esta caché para que se vuelva a analizar como la primera vez. */
function morfoStart(text,title,backScreen,rec){
  ui.morfo={text,title:title||'Texto',tokens:[],cats:null,subcats:null,morf:{},i:0,stage:'loading',results:[],ok:0,errMsg:'',level:'estudio',nivel:1,writeGiven:'',writeOk:false,writeDiff:null,skipPinAsk:false,writeSkipped:false,extra:null,back:backScreen||'list',start:Date.now()};
  ui.screen='morfo';render();
  const tokens=getWords(text).slice(0,220);
  if(rec&&Array.isArray(rec.morfoCats)&&rec.morfoCats.length===tokens.length){
    const st=ui.morfo;if(!st)return;
    st.tokens=tokens;st.cats=rec.morfoCats;st.subcats=rec.morfoSubs||tokens.map(()=>'');st.morf=rec.morfoMorf||{};st.stage='answer';render();return;
  }
  morfoAnalyze(text).then(r=>{
    const st=ui.morfo;if(!st||st.stage!=='loading')return;
    st.tokens=r.tokens;st.cats=r.cats;st.subcats=r.subs;st.morf=r.morf||{};st.stage='answer';
    if(rec){rec.morfoCats=r.cats;rec.morfoSubs=r.subs;rec.morfoMorf=r.morf||{};save();}
    render();
  }).catch(e=>{
    const st=ui.morfo;if(!st)return;st.stage='error';st.errMsg=e.message||'No se ha podido analizar el texto';render();
  });
}
function morfoFinish(){
  const st=ui.morfo;
  const secs=Math.round((Date.now()-(st.start||Date.now()))/1000);
  const res={n:st.tokens.length,ok:st.ok};
  if(ui.item){const it=itemsOf(todayStr()).find(x=>x.id===ui.item);if(it&&it.type==='morfo'){const [s,r]=recItem(it);r.secs=(r.secs||0)+secs;r.end=Date.now();r.done=true;r.res=res;touchSes(s);return;}}
  const s=getSes(todayStr(),true);if(!s.started)s.started=Date.now()-secs*1000;
  s.extra.push({id:uid(),kind:'morfo',title:'Análisis morfológico: '+st.title,start:Date.now()-secs*1000,end:Date.now(),secs,done:true,res});
  touchSes(s);
}
function morfoTextHTML(st){
  /* en Modo Examen no se revela nada hasta el final (como el resto de Exámenes de la app): las
     palabras ya respondidas no se colorean en verde/rojo según si se acertó o no (ni se ve su
     categoría al pasar el ratón) hasta llegar a stage 'done'. En Modo Estudio se sigue revelando
     al momento, como hasta ahora. */
  const reveal=st.level!=='examen'||st.stage==='done';
  let out='',pos=0;
  st.tokens.forEach((w,k)=>{
    out+=esc(st.text.slice(pos,w.i));
    const r=st.results[k];
    if(k===st.i&&st.stage==='answer')out+=`<span style="background:#ece9fb;color:var(--pri2);font-weight:800;border-radius:6px;padding:0 4px">${esc(w.t)}</span>`;
    else if(r&&reveal)out+=`<span class="${r.ok?'fixed':'miss'}" title="${esc(MORFO_LABEL[r.correct])}">${esc(w.t)}</span>`;
    else if(r)out+=`<span style="opacity:.55">${esc(w.t)}</span>`;
    else out+=esc(w.t);
    pos=w.e;
  });
  return out+esc(st.text.slice(pos));
}

/* cuando falla una palabra, antes de poder pasar a la siguiente Julia tiene que escribir ella

function morfoWriteDiffHTML(diff){

  ${diff.missing.length?`<p class="mute" style="margin:8px 0 0;font-size:.85rem">Y además te falta escribir: ${diff.missing.map(w=>`<b>${esc(w)}</b>`).join(', ')}</p>`:''}

/* pedido por David (2026-10-22): si Julia se queda atascada aquí -- p.ej. el corrector la marca mal
   algo que en realidad está bien -- que pueda saltar la palabra sin tener que escribir la respuesta
   correcta, pero pidiendo el PIN del tutor primero (para que sea el tutor quien lo decida, no ella
   sola). Solo aparece DESPUÉS de un primer intento fallido (st.writeDiff), para animar a intentarlo
   antes de saltar. Saltar no cambia si la palabra cuenta como acertada o no en las estadísticas
   (seguía contando como fallo desde que se eligió mal en morfoPick): solo quita la obligación de

    </div>`;

function morfoWriteGateHTML(st,cat,sub){
  /* en Modo Examen no se corrige nada hasta el final (como el resto de Exámenes de la app), así
     que aquí no se le pide a Julia que escriba la respuesta correcta tras fallar -- eso revelaría
     al momento si ha acertado o no. Solo se aplica en Modo Estudio. */
  if(st.level!=='examen'&&st.stage==='wrong'&&!st.writeOk){
    return `<div class="panel" style="border-color:var(--pri);background:#f1e9ff;margin-top:10px">

/* en Modo Estudio, al pasar el ratón por una opción de respuesta, en vez de un texto plano con la

function morfoBody(){

  if(st.stage==='error')return `<div class="panel" style="border-color:var(--bad)">😕 ${esc(st.errMsg)}</div><div class="row" style="margin-top:10px"><button class="btn" data-act="morfoBack">← Volver</button></div>`;
  if(st.stage==='done'){

    return `<div class="panel" style="border-color:var(--ok);background:var(--okbg)"><h2 style="margin:0">${st.ok===st.tokens.length?'🎉 ¡Perfecto!':'💪 ¡Bien hecho!'}</h2><div style="font-size:1.4rem;font-weight:800;margin-top:6px">${st.ok} de ${st.tokens.length} palabras bien clasificadas</div></div>

      const subOk=x.r.nivel===2;
      const correctTxt=esc(MORFO_LABEL[x.r.correct])+(subOk&&x.r.correctSub?` ${esc(morfoSubLabel(x.r.correct,x.r.correctSub).toLowerCase())}`:'');const pickTxt=esc(MORFO_LABEL[x.r.pick]||x.r.pick)+(subOk&&x.r.pickSub?` ${esc(morfoSubLabel(x.r.pick,x.r.pickSub).toLowerCase())}`:'');const why=morfoWhy(x.r.correct,subOk?x.r.correctSub:'');const whyTxt=why?`, porque ${esc(lcFirst(stripDot(why)))}`:'';return `<div class="panel" style="padding:10px 14px"><b>${esc(x.w)}</b>: pusiste <span class="wrong">${pickTxt}</span>, la respuesta correcta es: <span class="right">${correctTxt}</span>${whyTxt}</div>`;}).join('')}</div>`:''}

  const cat=st.cats[st.i],sub=st.nivel===2?((st.subcats&&st.subcats[st.i])||''):'',subTxt=sub?` ${esc(morfoSubLabel(cat,sub).toLowerCase())}`:'';

  ${st.stage==='answer'?`<div class="opts" style="grid-template-columns:repeat(${st.nivel===2?1:2},1fr)">${morfoOptions(st.nivel).map(o=>{

   :(st.level==='examen'

function renderMorfo(){

  <button class="btn ${st.nivel===2?'primary':''}" data-act="morfoNivel" data-nv="2" ${locked?'disabled':''} title="Nivel 2: además de la categoría, cuando la palabra es pronombre, adverbio o adjetivo hay que decir también el tipo exacto (por ejemplo, no solo «adverbio», sino «adverbio de tiempo»).">Nivel 2</button>
  </div>

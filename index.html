/* ================= Preposiciones (dentro de Análisis Morfológico) =================
   Apartado especial, aparte del ejercicio de clasificar palabra por palabra, para practicar
   solo las preposiciones. En Modo Estudio: la IA genera una ronda nueva de frases cortas (una
   por cada preposición, al estilo del cómic "Un día de playa con Ana" que dio pie a esto), y
   Julia tiene que PULSAR en la frase la palabra que es la preposición (no escribirla), con
   ayuda (la lista de las 21) y corrección al momento. En Modo Examen no hay frases: sustituye
   por completo a ese ejercicio escribir de memoria la lista completa de las 21 preposiciones,
   corrigiéndose solo al terminar, como el resto de Exámenes de la app. */
const PREP_LIST=['a','ante','bajo','con','contra','de','desde','durante','en','entre','hacia','hasta','mediante','para','por','según','sin','sobre','tras','versus','vía'];
const PREP_SET=new Set(PREP_LIST.map(exNorm));
function prepGenPrompt(subset){
  const list=subset.join(', ');
  return [{role:'system',content:`Eres un profesor de Lengua de primaria (Year 6, 10-11 años, colegio británico) que prepara frases cortas en español para practicar las preposiciones, al estilo de un cómic sencillo (una escena breve de la vida diaria). Para cada una de estas preposiciones, en este orden, escribe UNA frase corta y natural (entre 5 y 10 palabras) que la use exactamente UNA vez, escrita tal cual, sin cambiarla de forma: ${list}. Las frases deben ser sencillas y variadas, parecidas a estos ejemplos: "Ana se para ante un castillo.", "El agua le llega hasta las rodillas.", "Toby corre tras la gaviota." Devuelve SOLO un JSON válido, sin explicaciones: {"frases":[{"prep":"<la preposición tal cual de la lista>","texto":"<la frase>"}]} con EXACTAMENTE ${subset.length} elementos, en el mismo orden que la lista de preposiciones.`},
   {role:'user',content:'Genera las frases.'}];
}
/* valida cada frase generada: para poder comprobar lo que Julia pulsa, la frase tiene que
   contener, como una de sus palabras (tokenizada igual que el resto de la app, ver getWords),
   exactamente la preposición que se le pidió -- si la IA se equivoca y no la incluye tal cual,
   esa frase se descarta en vez de dejar un ejercicio sin ninguna palabra correcta que pulsar.
   También se descarta si esa misma palabra aparece MÁS DE UNA VEZ en la frase (p.ej. "de" dos
   veces): aunque se le pidió a la IA que la usara una sola vez, si se equivoca y la repite, no
   hay forma de saber cuál de las dos pulsaría Julia como correcta -- mejor descartar esa frase
   que dejar un ejercicio ambiguo donde pulsar la "otra" preposición cuenta como fallo. También
   conserva de qué preposición es cada frase, para poder guardarla en state.prepPool bajo esa
   preposición (ver prepEnsurePool). */
function prepValidateWithPrep(raw){
  if(!Array.isArray(raw))return [];
  const out=[];
  raw.forEach(f=>{
    if(!f||typeof f.texto!=='string'||typeof f.prep!=='string')return;
    const texto=f.texto.trim();if(!texto)return;
    const prepN=exNorm(f.prep);if(!PREP_SET.has(prepN))return;
    const tokens=getWords(texto);
    const matches=tokens.map((w,i)=>exNorm(w.t)===prepN?i:-1).filter(i=>i>=0);
    if(matches.length!==1)return;
    const prepCanon=PREP_LIST.find(p=>exNorm(p)===prepN)||f.prep;
    out.push({prep:prepCanon,texto,tokens,idx:matches[0]});
  });
  return out;
}
/* Banco de frases de Preposiciones (state.prepPool, una frase fija por preposición -- 21 en
   total): pedido por David, que todo lo que use IA se genere UNA SOLA VEZ y no se vuelva a gastar
   tokens cada vez que se repite la actividad. Antes, cada vez que Julia entraba a "Preposiciones
   (estudio)" se le pedía a la IA una ronda de 21 frases NUEVAS, siempre, sin guardar nada. Ahora
   se guardan en caché (por dispositivo, igual que la voz de los dictados) y solo se le vuelve a
   pedir algo a la IA si falta alguna preposición en el banco (la primera vez, o si alguna frase no
   se pudo validar) -- cada preposición, una vez conseguida su frase, no se vuelve a regenerar.
   La variedad entre rondas la da solo barajar el ORDEN en el que aparecen las 21 frases
   (prepGenRound), no frases distintas cada vez. */
/* "mejor esfuerzo": si falla el intento de rellenar lo que falta en el banco (sin conexión, JSON
   raro, ninguna frase válida...), NO lanzamos el error hacia fuera -- lo que ya hubiera en el
   banco antes de esta llamada sigue intacto, y prepGenRound construye la ronda con esas frases
   (aunque sean menos de 21), igual que ya tolera el código de siempre. Antes de este arreglo, un
   fallo al rellenar aunque fuera 1 sola preposición que faltaba rompía la ronda entera, incluso
   con las otras 20 ya guardadas y perfectamente buenas -- hallazgo real de la revisión adversarial
   antes de entregar. */
async function prepEnsurePool(){
  const missing=PREP_LIST.filter(p=>!state.prepPool[p]);
  if(!missing.length)return;
  try{
    const raw=await aiText(prepGenPrompt(missing),Math.min(1400,200+missing.length*70));
    const m=raw.match(/\{[\s\S]*\}/);if(!m)return;
    let j;try{j=JSON.parse(m[0]);}catch(e){return;}
    const valid=prepValidateWithPrep(j.frases);
    if(!valid.length)return;
    valid.forEach(v=>{state.prepPool[v.prep]={texto:v.texto,tokens:v.tokens,idx:v.idx};});
    save();
  }catch(e){/* mejor esfuerzo: se queda con lo que ya hubiera en el banco */}
}
async function prepGenRound(){
  await prepEnsurePool(); // no pide nada a la IA si el banco ya tiene las 21 preposiciones
  const order=PREP_LIST.slice().sort(()=>Math.random()-0.5);
  const sentences=order.filter(p=>state.prepPool[p]).map(p=>{const c=state.prepPool[p];return {texto:c.texto,tokens:c.tokens,idx:c.idx};});
  if(!sentences.length)throw new Error('No hay frases disponibles; inténtalo de nuevo');
  return sentences;
}
function prepStart(backScreen){
  ui.prep={level:'estudio',stage:'loading',sentences:[],i:0,picked:null,results:[],ok:0,errMsg:'',examGiven:'',examChecked:false,examResult:null,back:backScreen||'morfolist',start:Date.now()};
  ui.screen='morfoprep';render();
  prepGenRound().then(sentences=>{
    const st=ui.prep;if(!st||st.stage!=='loading')return;
    st.sentences=sentences;st.stage='answer';render();
  }).catch(e=>{
    const st=ui.prep;if(!st)return;st.stage='error';st.errMsg=e.message||'No se han podido generar las frases';render();
  });
}
/* registra el resultado en el informe del día (sessionReport, ver p4a.js, kind 'prep'): tanto si
   viene de terminar una ronda de frases en Modo Estudio (prepFinish) como de comprobar la lista
   escrita de memoria en Modo Examen (prepExamFinish) -- antes solo se registraba el Modo Estudio,
   dejando el Modo Examen sin aparecer en el resumen del día. */
function prepRecordResult(n,ok){
  const st=ui.prep;
  const secs=Math.round((Date.now()-(st.start||Date.now()))/1000);
  const res={n,ok};
  const s=getSes(todayStr(),true);if(!s.started)s.started=Date.now()-secs*1000;
  s.extra.push({id:uid(),kind:'prep',title:'Preposiciones',start:Date.now()-secs*1000,end:Date.now(),secs,done:true,res});
  touchSes(s);
}
function prepFinish(){const st=ui.prep;prepRecordResult(st.sentences.length,st.ok);}
/* pinta la frase actual con cada palabra pulsable, conservando espacios y signos de puntuación
   tal cual (igual que morfoTextHTML). Antes de pulsar, todas son botones neutros; tras pulsar
   una, se revela la correcta en verde y, si se pulsó otra distinta, esa se marca en rojo. */
function prepSentHTML(st){
  const sent=st.sentences[st.i];
  let out='',pos=0;
  sent.tokens.forEach((w,k)=>{
    out+=esc(sent.texto.slice(pos,w.i));
    const reveal=st.picked!==null;
    let cls='';
    if(reveal){
      if(k===sent.idx)cls=' ok';
      else if(k===st.picked)cls=' bad';
    }
    out+=`<button class="prepw${cls}" data-act="prepPick" data-i="${k}" ${reveal?'disabled':''}>${esc(w.t)}</button>`;
    pos=w.e;
  });
  return out+esc(sent.texto.slice(pos));
}
function prepBody(){
  const st=ui.prep;
  if(st.stage==='loading')return `<div class="panel" style="text-align:center">🔗 Preparando frases nuevas… un momento.</div>`;
  if(st.stage==='error')return `<div class="panel" style="border-color:var(--bad)">😕 ${esc(st.errMsg)}</div><div class="row" style="margin-top:10px"><button class="btn" data-act="prepBack">← Volver</button></div>`;
  if(st.stage==='done'){
    const bad=st.results.filter(r=>!r.ok);
    return `<div class="panel" style="border-color:var(--ok);background:var(--okbg)"><h2 style="margin:0">${st.ok===st.sentences.length?'🎉 ¡Perfecto!':'💪 ¡Bien hecho!'}</h2><div style="font-size:1.4rem;font-weight:800;margin-top:6px">${st.ok} de ${st.sentences.length} frases bien</div></div>
    ${bad.length?`<h3>Repasa estas</h3><div class="list">${bad.map(r=>`<div class="panel" style="padding:10px 14px">${esc(r.texto)}<br>La preposición era: <span class="right">${esc(r.correctWord)}</span>${r.pickedWord?` · pulsaste: <span class="wrong">${esc(r.pickedWord)}</span>`:' · no llegaste a pulsar ninguna palabra'}</div>`).join('')}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn primary big" data-act="prepBack">← Volver</button></div>`;
  }
  const sent=st.sentences[st.i],picked=st.picked,ok=picked!==null?picked===sent.idx:null;
  return `<p class="mute" style="margin:4px 0 10px">Frase ${st.i+1} de ${st.sentences.length}</p>
  <p class="mute" style="margin:0 0 6px">Pulsa la palabra de la frase que es la <b>preposición</b>:</p>
  <div class="panel" style="line-height:2.4;font-size:1.15rem">${prepSentHTML(st)}</div>
  ${picked!==null?`<div class="msg ${ok?'right':'wrong'}" style="margin-top:10px">${ok?'✅ ¡Correcto!':`❌ La preposición era: «${esc(sent.tokens[sent.idx].t)}»`}</div>
  <div class="row" style="margin-top:10px"><button class="btn success big" data-act="prepNext">${st.i+1<st.sentences.length?'Siguiente ➜':'Terminar'}</button></div>`:''}
  <div class="row" style="margin-top:14px"><button class="link" data-act="prepBack">← Salir</button></div>`;
}

/* ================= diccionario guiado inglés → español (con IA) =================
   Julia escribe CUALQUIER palabra en inglés que quiera consultar. La IA nunca traduce
   directamente: da una definición sencilla en inglés, un par de frases de ejemplo y algún
   sinónimo, todo en inglés, adaptado a su nivel (10-11 años, colegio británico). Con esas
   pistas, Julia intenta adivinar el significado en español, y solo al pulsar "Ver traducción"
   se le revela la traducción real para que ella misma compruebe si había acertado. */
function engDictPrompt(word){
  return [{role:'system',content:`Eres un profesor de inglés que ayuda a un alumno español de primaria (Year 6, 10-11 años, colegio británico) a adivinar el significado de una palabra en inglés SIN decírselo nunca. Te doy una palabra en inglés. Da pistas EN INGLÉS sencillo (adaptado a su nivel): una definición corta y fácil, 2 frases de ejemplo naturales usando la palabra, y hasta 2 sinónimos sencillos en inglés si existen. IMPORTANTE: en la definición, los ejemplos y los sinónimos NUNCA escribas la traducción al español de la palabra, ni la palabra en español, ni ninguna pista tan obvia que sea prácticamente decírselo (por ejemplo, no uses un cognado evidente si existe una forma de explicarlo sin él). Además, en un campo separado "spanishHint", da una pista EXTRA pero esta vez EN ESPAÑOL (para cuando, aun con las pistas en inglés, el alumno siga sin saber qué significa): una explicación o definición sencilla en español de lo que significa la palabra, con la MISMA norma que antes — nunca escribas la traducción exacta de la palabra ni un sinónimo en español tan evidente que sea prácticamente decírsela. Aparte, en otro campo separado "translation" (que no se le mostrará al alumno hasta que él pida comprobar su respuesta), da la traducción correcta al español de esa palabra en este contexto. Devuelve SOLO un JSON válido: {"pos":"noun|verb|adjective|adverb|other","definition":"...","examples":["...","..."],"synonyms":["...","..."],"spanishHint":"...","translation":"..."}. Si "${word}" no es una palabra real en inglés o no la reconoces, devuelve en su lugar SOLO {"error":"..."} con una frase breve en español explicando por qué.`},
   {role:'user',content:`Palabra: "${word}"`}];
}
/* caché por palabra (state.engDictCache, por dispositivo igual que la voz de los dictados):
   pedido por David, que esto se genere UNA SOLA VEZ por palabra y no se le vuelva a gastar
   tokens a la IA si Julia (u otro día, u otra sesión) vuelve a consultar la MISMA palabra.
   Julia sigue pudiendo preguntar cualquier palabra -- esto no limita el diccionario a una lista
   fija -- solo evita repetir la llamada a la IA cuando la palabra ya se consultó antes. */
async function engDictAnalyze(word){
  const key=word.toLowerCase().trim();
  const cached=state.engDictCache[key];if(cached)return cached;
  const raw=await aiText(engDictPrompt(word),700);
  const m=raw.match(/\{[\s\S]*\}/);if(!m)throw new Error('No he podido buscar esta palabra');
  let j;try{j=JSON.parse(m[0]);}catch(e){throw new Error('No he podido buscar esta palabra');}
  if(j.error)throw new Error(String(j.error).slice(0,200));
  if(!j.definition||!j.translation)throw new Error('No he podido buscar esta palabra');
  const clue={
    pos:String(j.pos||'').slice(0,20),
    definition:String(j.definition).slice(0,400),
    examples:(Array.isArray(j.examples)?j.examples:[]).map(x=>String(x).slice(0,200)).slice(0,3),
    synonyms:(Array.isArray(j.synonyms)?j.synonyms:[]).map(x=>String(x).slice(0,40)).slice(0,4),
    spanishHint:String(j.spanishHint||'').slice(0,400),
    translation:String(j.translation).slice(0,120)
  };
  state.engDictCache[key]=clue;save();
  return clue;
}

/* ================= Spelling: listas de palabras en inglés (tutor) =================
   Cada lista es una colección de palabras en inglés para practicar ortografía (spelling), al
   nivel de Year 6 de un colegio británico -nunca más difícil-. El tutor las crea escribiéndolas
   o subiendo una foto (se transcriben con IA y se revisan en el mismo cuadro de texto antes de
   añadirlas, igual que si se hubieran escrito a mano). Para cada palabra se puede generar con IA
   una frase con hueco ("___") que solo esa palabra completa bien, para el ejercicio de "frases
   para completar" de Julia. */
const spGet=id=>state.spelling.find(l=>l.id===id);
const SPELL_WORDS_SYS='Eres un transcriptor de listas de vocabulario en inglés para una alumna de Year 6 de un colegio británico (10-11 años). En la imagen hay una lista de palabras en inglés para estudiar (puede tener traducciones al español, numeración, viñetas o estar manuscrita). Transcribe SOLO las palabras en INGLÉS, una por línea, exactamente como están escritas (no corrijas faltas de ortografía), sin numeración, sin viñetas, sin las traducciones al español ni ninguna otra anotación. Si una palabra está repetida, escríbela solo una vez. Responde SOLO con la lista, una palabra por línea, sin comentarios ni explicaciones.';
async function readSpellingPhoto(file){
  const dataUrl=await fileToJpeg(file,1800);
  const t=await aiText([{role:'system',content:SPELL_WORDS_SYS},{role:'user',content:[{type:'text',text:'Transcribe las palabras en inglés de esta lista.'},{type:'image_url',image_url:{url:dataUrl,detail:'high'}}]}],500);
  if(!t)throw new Error('No he podido leer ninguna palabra en la foto. Prueba con más luz y la hoja recta.');
  return t.replace(/^```[a-z]*\n?|```$/g,'').trim();
}
function spParseWords(txt){
  return [...new Set((txt||'').split(/[\n,;]+/).map(w=>w.trim().replace(/^[-•*\d.)\s]+/,'').trim()).filter(Boolean))];
}
/* revisión ortográfica de las palabras en inglés antes de añadirlas a una lista (habitualmente son
   en inglés y si el tutor se equivoca al escribirlas, Julia las practicaría mal) -- la IA solo
   corrige faltas de ortografía claras, nunca cambia una palabra solo por ser poco común, y respeta
   nombres propios. */
const SPELL_WORDCHECK_SYS='Eres un profesor de inglés que revisa, antes de usarla en un dictado de spelling, una lista de palabras en inglés escrita por el tutor de una alumna de Year 6 de colegio británico (10-11 años). Para cada palabra, comprueba si está bien escrita en inglés estándar (un nombre propio válido también cuenta como bien escrito). Si está bien escrita, "fix" debe ser una cadena vacía "". Si tiene una falta de ortografía clara, "fix" debe ser la corrección en inglés. No "corrijas" una palabra solo por ser poco frecuente o informal: corrige únicamente faltas de ortografía reales. Devuelve SOLO un JSON válido, sin texto alrededor: una lista de objetos {"word":"<la palabra exacta tal cual te la han dado>","fix":"<la corrección, o \"\" si ya está bien>"}, un objeto por cada palabra de la lista, en el mismo orden, sin añadir ni quitar ninguna.';
/* igual que con las frases (ver spGenSentencesFor), con listas largas troceamos en grupos
   pequeños para no agotar el presupuesto de tokens de la respuesta -incluido el "pensamiento"
   interno de los modelos de razonamiento- antes de terminar el JSON. */
const SPELL_WORDCHECK_CHUNK=10;
async function spCheckSpellingChunk(words){
  if(!words.length)return [];
  const max=Math.min(2500,400+words.length*60);
  const t=await aiText([{role:'system',content:SPELL_WORDCHECK_SYS},{role:'user',content:'Palabras:\n'+words.join('\n')}],max);
  const m=t.match(/\[[\s\S]*\]/);if(!m)throw new Error('La IA no ha podido revisar la ortografía');
  let arr;try{arr=JSON.parse(m[0]);}catch(e){throw new Error('La IA no ha podido revisar la ortografía');}
  if(!Array.isArray(arr))throw new Error('La IA no ha podido revisar la ortografía');
  return words.map(w=>{
    const f=arr.find(x=>x&&String(x.word||'').trim().toLowerCase()===w.toLowerCase());
    const fix=f&&f.fix?String(f.fix).trim():'';

async function spCheckSpelling(words){

  const chunks=[];for(let i=0;i<words.length;i+=SPELL_WORDCHECK_CHUNK)chunks.push(words.slice(i,i+SPELL_WORDCHECK_CHUNK));

/* Con listas largas (p.ej. 19 palabras de golpe) un único mensaje a la IA tenía que generar
   muchísimo JSON en una sola respuesta; con los modelos de razonamiento (gpt-6.1-sol y
   similares) el presupuesto de tokens de la respuesta también incluye el "pensamiento" interno
   del modelo, así que con una lista larga se quedaba sin tokens antes de terminar el JSON y la
   respuesta llegaba cortada (de ahí el "La IA no devolvió frases válidas"). Troceamos la lista en
   grupos pequeños -cada uno con su propio presupuesto de tokens generoso- para que cada petición
   sea mucho más corta y, si un grupo falla, los demás se generen igualmente en vez de perderse
   toda la tanda. */
const SPELL_SENT_CHUNK=6;
function spGenSentencesFor(words){
  const max=Math.min(3000,500+words.length*220);
  return aiText([{role:'system',content:SPELL_SENT_SYS},{role:'user',content:'Palabras: '+words.join(', ')}],max).then(t=>{
    const m=t.match(/\[[\s\S]*\]/);
    if(!m)throw new Error('La IA no devolvió frases válidas'+(t?' (respuesta incompleta o inesperada)':' (respuesta vacía)'));
    let arr;try{arr=JSON.parse(m[0]);}catch(e){throw new Error('La IA no devolvió frases válidas (JSON incompleto, prueba con menos palabras a la vez)');}
    if(!Array.isArray(arr))throw new Error('La IA no devolvió frases válidas');

   qué voz usar en Ajustes (se guarda en state.settings.spVoice, por dispositivo, igual que la voz

const EnVoice=(()=>{

  const score=v=>(/premium/i.test(v.name)?30:0)+(/siri/i.test(v.name)?25:0)+(/natural|neural|online/i.test(v.name)?25:0)+(/enhanced|mejorada|ampliada/i.test(v.name)?20:0)+(/^en-GB/i.test(v.lang)?3:0)-(/compact|eloquence|espeak/i.test(v.name)?15:0);
  const loadV=()=>{try{voices=(synth.getVoices()||[]).filter(v=>/^en/i.test(v.lang));voices.forEach(v=>v._q=score(v));voices.sort((a,b)=>b._q-a._q);}catch(e){}};

  return{
    voices:()=>voices,
    pick(name){return (name&&voices.find(v=>v.name===name))||voices[0]||null;}
  };

const SPELL_CHECK_SYS='Eres un transcriptor literal de texto manuscrito (OCR). La imagen es la hoja de una niña de primaria que ha escrito, al dictado, una lista de palabras en inglés, una debajo de otra (puede haber números delante). Transcribe EXACTAMENTE lo que ha escrito, letra por letra, sin corregir ninguna falta de ortografía: copia la palabra tal cual está, aunque esté mal escrita. Una palabra por línea, en el mismo orden en que aparecen en la hoja, sin números ni viñetas. Si una palabra es totalmente ilegible, escribe [?] en su lugar. Responde SOLO con la lista, una palabra por línea, sin comentarios.';
async function readSpellingAnswerPhoto(file){
  const dataUrl=await fileToJpeg(file,1800);
  const t=await aiText([{role:'system',content:SPELL_CHECK_SYS},{role:'user',content:[{type:'text',text:'Transcribe literalmente, palabra por palabra, lo que ha escrito.'},{type:'image_url',image_url:{url:dataUrl,detail:'high'}}]}],500);
  return t.replace(/^```[a-z]*\n?|```$/g,'').trim();

/* ---- corrección del significado que escribe Julia (solo en "escuchar", ver spDictCheckMeaning):
   la IA valora si lo que ha escrito en español es un significado correcto de la palabra en
   inglés, siendo flexible con sinónimos y pequeñas erratas. Si la IA falla (sin conexión, etc.),
   no se bloquea a Julia: se trata como "no se ha podido comprobar" y puede seguir igualmente. ---- */
const SP_MEANING_SYS='Eres un profesor de inglés de primaria (Year 6, 10-11 años, colegio británico) que corrige si el significado en español que ha escrito una alumna para una palabra en inglés es correcto. Sé flexible: acepta sinónimos, variantes de género/número razonables y pequeñas erratas; solo marca mal si el significado es claramente distinto o no tiene que ver. Devuelve SOLO un JSON válido: {"ok":true/false,"correct":"una traducción correcta breve en español"}.';
async function spGradeMeaning(word,given){
  const t=await aiText([{role:'system',content:SP_MEANING_SYS},{role:'user',content:`Palabra en inglés: "${word}"\nSignificado que ha escrito la alumna en español: "${given}"`}],150);
  const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error('La IA no devolvió una corrección válida');
  let j;try{j=JSON.parse(m[0]);}catch(e){throw new Error('La IA no devolvió una corrección válida');}
  return {ok:!!j.ok,correct:String(j.correct||'').trim()};
}
/* ---- registrar resultados (igual que recordDictado/morfoFinish: si viene de los deberes del
   día (ui.item) se apunta en esa tarea; si no, se apunta como actividad suelta). ---- */
function spellFinish(l,r,kind){
  const n=r.results.length,okN=r.results.filter(x=>x.ok).length;
  const secs=Math.round((Date.now()-(ui.t0||Date.now()))/1000);
  const res={n,ok:okN,kind,wrong:r.results.filter(x=>!x.ok).map(x=>({word:x.word,given:x.given,meaning:x.meaning||'',meaningOk:x.meaningOk}))};
  /* si esta ronda es parte de los deberes del día (2 de escuchar + 1 de frases), no se registra
     todavía: se acumula en ui.spHw y el deber se cierra una sola vez, al terminar la última
     ronda (ver spHwFinishAll). Hallazgo real de la revisión adversarial, ya corregido: antes esta
     ronda recién terminada solo quedaba en memoria (ui.spHw.rounds) hasta que se pulsaba "Siguiente
     ronda" -- si Julia cerraba la app justo viendo la pantalla de resultados de ESTA ronda (ya
     terminada de verdad, sin nada pendiente), el progreso guardado en disco (state.spellProgress)
     todavía no se había actualizado, así que al volver se repetía esa ronda entera otra vez,
     aunque ya estuviera bien hecha -- justo lo contrario de lo que promete el aviso de "las rondas
     que ya has terminado quedan guardadas". Se guarda aquí mismo, nada más terminar la ronda --
     avanzando YA el número de ronda (hw.step++) y guardándolo con la ronda ya metida en
     hw.rounds -- para que quede a salvo aunque no llegue a pulsar "Siguiente ronda"; si retoma
     desde aquí, continúa en la ronda siguiente, no repite esta que ya está bien guardada.
     spHwNext() ya no necesita avanzar el número de ronda él mismo (ver más abajo), y
     renderSpellDone() calcula "¿hay más rondas?" con hw.step directamente (ya apunta a la
     siguiente), no con hw.step+1. */
  if(ui.spHw){ui.spHw.rounds.push(res);ui.spHw.secs=(ui.spHw.secs||0)+secs;ui.spHw.step++;spellHwSave();return;}
  if(ui.item){const it=itemsOf(todayStr()).find(x=>x.id===ui.item);if(it&&it.type==='spelling'){const [s,rr]=recItem(it);rr.secs=(rr.secs||0)+secs;rr.end=Date.now();rr.done=true;rr.res=res;touchSes(s);return;}}
  const s=getSes(todayStr(),true);if(!s.started)s.started=Date.now()-secs*1000;
  s.extra.push({id:uid(),kind:'spelling',title:'Spelling: '+(l?l.title:''),start:Date.now()-secs*1000,end:Date.now(),secs,res,done:true});touchSes(s);
}

function spHwFinishAll(){

  const wrong=hw.rounds.flatMap(r=>r.wrong||[]);

    const cfg=ui.spHwCfg||{};
    const dR=cfg.dictRounds||2,sR=cfg.sentRounds!==undefined?cfg.sentRounds:1;
    const steps=Array(Math.max(1,dR)).fill('dict').concat(Array(Math.max(0,sR)).fill('sent'));
    /* si había un deber de esta MISMA lista a medias, con el MISMO reparto de rondas que se le ha
       puesto hoy (si el tutor cambió el nº de rondas desde entonces, no tendría sentido retomar
       una ronda pensada para el reparto viejo), se retoma justo donde se dejó; si no, empieza de
       cero. Mismo criterio que studyOpenHomework (Teoría) con el nº de preguntas/modo. */
    const saved=state.spellProgress&&state.spellProgress[l.id];
    if(saved&&saved.dictRounds===dR&&saved.sentRounds===sR&&saved.step<steps.length){
      ui.spHw={listId:l.id,step:saved.step,steps,dictRounds:dR,sentRounds:sR,rounds:saved.rounds||[],secs:saved.secs||0};
    }else{
      ui.spHw={listId:l.id,step:0,steps,dictRounds:dR,sentRounds:sR,rounds:[],secs:0};
    }
    spHwRunStep();
  },
  spHwNext(){
    /* hw.step ya se avanzó en spellFinish() (ver el comentario de ahí), nada más terminar la
       ronda -- aquí solo falta arrancar la siguiente, o cerrar el deber si ya no quedan. */
    const hw=ui.spHw;if(!hw)return;
    if(hw.step>=hw.steps.length)return spHwFinishAll();
    spHwRunStep();
  },
  spDictModeTyping(){const r=ui.spRun;if(!r)return;r.stage='typing';r.i=0;r.given='';r.ok=null;r.results=[];r.meaning='';r.meaningOk=undefined;r.meaningCorrect='';render();},
  spDictModePhoto(){const r=ui.spRun;if(!r)return;r.stage='photowait';r.i=0;r.photoMeanings=[];r.photoMeaningOk=[];r.photoMeaningCorrect=[];render();},
  spDictPlay(){
    const r=ui.spRun;if(!r)return;const l=spGet(r.listId);if(!l)return;
    const words=spWordObjs(l,r.order);const w=words[r.i];if(!w)return;
    /* al pulsar "Escuchar" el foco del botón se queda en el propio botón -- ponemos el cursor ya
       en el cuadro de escribir para que Julia pueda teclear sin tener que pulsar antes con el
       ratón. Esperamos 1 segundo antes de reproducir la palabra (si se llama a la voz demasiado
       pegado al clic, a veces se corta el principio de la palabra). */
    const inp=$('#spDictAns');if(inp)inp.focus();
    setTimeout(()=>{
      sayWordEN(w.w,()=>{const inp2=$('#spDictAns');if(inp2)inp2.focus();});
    },1000);
  },
  spDictCheck(){
    const r=ui.spRun;if(!r||r.stage!=='typing')return;const l=spGet(r.listId);if(!l)return;
    const words=spWordObjs(l,r.order);const w=words[r.i];
    const v=($('#spDictAns')&&$('#spDictAns').value||'').trim();r.given=v;
    if(!v)return toast('Escribe la palabra primero');
    r.ok=spGrade(v,w.w);r.stage='checked';r.retypeGiven='';r.retypeOk=false;
    r.results.push({wordId:w.id,word:w.w,given:v,ok:r.ok});
    chime(r.ok);
    const y=scrollY;render();scrollTo(0,y);
  },
  /* si falla la palabra, antes de poder seguir con el significado (y pasar a la siguiente)
     tiene que volver a escribirla bien -- igual idea que el significado obligatorio, pero para
     reforzar la ortografía en sí (ver spDictNext). */
  spDictRetypeCheck(){
    const r=ui.spRun;if(!r||r.stage!=='checked'||r.ok)return;const l=spGet(r.listId);if(!l)return;
    const words=spWordObjs(l,r.order);const w=words[r.i];if(!w)return;
    const v=($('#spDictRetype')&&$('#spDictRetype').value||'').trim();r.retypeGiven=v;
    if(!v)return toast('Escribe la palabra primero');
    if(spGrade(v,w.w))r.retypeOk=true;
    else toast('Todavía no está bien escrita, mira arriba e inténtalo otra vez');
    const y=scrollY;render();scrollTo(0,y);
  },
  /* comprueba con la IA si el significado que ha escrito Julia es correcto (solo en "escuchar",
     en cualquiera de los dos modos: escribiendo en el ordenador -stage 'checked'- o en papel
     -stage 'photowait'-). Hay que comprobarlo antes de poder avanzar a la siguiente palabra: así
     se le dice si acertó o no, en vez de guardarlo sin más. Si la IA falla (sin conexión, etc.) no
     se bloquea a Julia: se marca como "no se ha podido comprobar" y puede seguir igual. */
  async spDictCheckMeaning(){
    const r=ui.spRun;if(!r||(r.stage!=='checked'&&r.stage!=='photowait')||r.meaningBusy)return;
    const l=spGet(r.listId);if(!l)return;
    const words=spWordObjs(l,r.order);const w=words[r.i];if(!w)return;
    const mv=($('#spDictMeaning')&&$('#spDictMeaning').value||'').trim();
    if(!mv)return toast('Escribe el significado primero');
    r.meaningBusy=true;render();
    let ok=null,correct='';
    try{const g=await spGradeMeaning(w.w,mv);ok=g.ok;correct=g.correct;}catch(e){ok=null;correct='';}
    r.meaningBusy=false;
    if(ok!==null)chime(ok);
    if(r.stage==='checked'){
      r.meaning=mv;r.meaningOk=ok;r.meaningCorrect=correct;
      if(r.results.length)Object.assign(r.results[r.results.length-1],{meaning:mv,meaningOk:ok});
    }else{
      r.photoMeanings=r.photoMeanings||[];r.photoMeanings[r.i]=mv;
      r.photoMeaningOk=r.photoMeaningOk||[];r.photoMeaningOk[r.i]=ok;
      r.photoMeaningCorrect=r.photoMeaningCorrect||[];r.photoMeaningCorrect[r.i]=correct;
    }
    const y=scrollY;render();scrollTo(0,y);
  },
  spDictNext(){
    const r=ui.spRun;if(!r)return;const l=spGet(r.listId);if(!l)return;
    const words=spWordObjs(l,r.order);
    /* antes de pasar a la siguiente palabra, hace falta haber comprobado el significado con
       "✔ Comprobar significado" (solo en el dictado de spelling, no en las frases). */
    if(r.ok===false&&!r.retypeOk)return toast('Primero vuelve a escribir la palabra correctamente');
    if(r.meaningOk===undefined)return toast('Comprueba primero el significado');
    r.i++;r.given='';r.ok=null;r.meaning='';r.meaningOk=undefined;r.meaningCorrect='';r.retypeGiven='';r.retypeOk=false;r.stage='typing';
    /* igual que en mates/exámenes/estudio de temas/análisis morfológico: un minijuego cada X
       palabras según la frecuencia de Ajustes (miniGameEvery), nunca garantizado al terminar la
       ronda (ver miniGameDue, p5d.js). */
    if(r.i>=words.length){r.stage='done';spellFinish(l,r,'dict');return render();}
    if(miniGameDue(r.i,words.length))return startMiniGame('spelldict');
    const y=scrollY;render();scrollTo(0,y);
  },
  spDictPhoneNext(){
    const r=ui.spRun;if(!r)return;const l=spGet(r.listId);if(!l)return;
    const mSt=(r.photoMeaningOk||[])[r.i];
    if(mSt===undefined)return toast('Comprueba primero el significado');
    const words=spWordObjs(l,r.order);
    r.i++;
    if(r.i>=words.length){r.stage='photoupload';return render();}
    if(miniGameDue(r.i,words.length))return startMiniGame('spelldict');
    render();
  },
  async spDictPhotoUpload(file){
    const r=ui.spRun;if(!r)return;const l=spGet(r.listId);if(!l)return;
    if(!state.ai.photoOn)return toast('Activa la IA de fotos en Ajustes para leer fotos');
    if(!file)return;
    const st=$('#spDictPhotoSt');if(st)st.textContent='🔎 Leyendo tu foto…';
    const words=spWordObjs(l,r.order);
    try{
      const txt=await readSpellingAnswerPhoto(file);
      const lines=txt.split('\n').map(x=>x.trim()).filter(Boolean);
      r.results=words.map((w,i)=>{const given=lines[i]||'';return {wordId:w.id,word:w.w,given,ok:spGrade(given,w.w),meaning:(r.photoMeanings&&r.photoMeanings[i])||'',meaningOk:(r.photoMeaningOk&&r.photoMeaningOk[i])};});
      r.stage='done';spellFinish(l,r,'dict');render();
    }catch(e){
      r.photoErr=e.message;
      const st2=$('#spDictPhotoSt');if(st2)st2.innerHTML=`⚠️ ${esc(e.message)}`;
    }
  },
  spDictRepeat(){
    const r=ui.spRun;if(!r)return;const l=spGet(r.listId);if(!l)return;
    ui.spRun={listId:l.id,stage:'ask',order:shuffleArr(l.words.map(w=>w.id)),i:0,given:'',ok:null,results:[],photoErr:'',meaning:'',meaningOk:undefined,meaningBusy:false,meaningCorrect:'',retypeGiven:'',retypeOk:false,photoMeanings:[],photoMeaningOk:[],photoMeaningCorrect:[]};
    ui.t0=Date.now();render();
  },
  spDictQuit(){if(ui.spHw){ui.spHwQuitAsk=true;return render();}ui.spRun=null;ui.spHw=null;ui.screen='spelllist';render();},
  spSentStart(b){
    const l=spGet(b.dataset.id);if(!l||l.status!=='ready')return toast('Esta lista no está disponible');
    if(!l.sentences.length)return toast('Esta lista todavía no tiene frases');
    ui.spRun={listId:l.id,order:shuffleArr(l.sentences.map(s=>s.id)),i:0,given:'',stage:'answer',ok:null,results:[]};
    ui.t0=Date.now();ui.screen='spellsent';render();
  },
  spSentCheck(){
    const r=ui.spRun;if(!r||r.stage!=='answer')return;const l=spGet(r.listId);if(!l)return;
    const s=l.sentences.find(x=>x.id===r.order[r.i]);if(!s)return;
    const w=l.words.find(x=>x.id===s.wordId);
    const v=($('#spSentAns')&&$('#spSentAns').value||'').trim();r.given=v;
    if(!v)return toast('Escribe la palabra que falta');
    r.ok=w?spGrade(v,w.w):false;r.stage='checked';
    r.results.push({word:w?w.w:'?',given:v,ok:r.ok});
    chime(r.ok);
    const y=scrollY;render();scrollTo(0,y);
  },
  spSentNext(){
    const r=ui.spRun;if(!r)return;const l=spGet(r.listId);
    r.i++;r.given='';r.ok=null;r.stage='answer';
    /* igual que en el dictado de spelling (y en mates/exámenes/estudio/morfología): minijuego
       cada X frases según la frecuencia de Ajustes, nunca garantizado al terminar la ronda. */
    if(r.i>=r.order.length){r.stage='done';spellFinish(l,r,'sent');return render();}
    if(miniGameDue(r.i,r.order.length))return startMiniGame('spellsent');
    const y=scrollY;render();scrollTo(0,y);
  },
  spSentRepeat(){
    const r=ui.spRun;if(!r)return;const l=spGet(r.listId);if(!l)return;
    ui.spRun={listId:l.id,order:shuffleArr(l.sentences.map(s=>s.id)),i:0,given:'',stage:'answer',ok:null,results:[]};
    ui.t0=Date.now();render();
  },
  spSentQuit(){if(ui.spHw){ui.spHwQuitAsk=true;return render();}ui.spRun=null;ui.spHw=null;ui.screen='spelllist';render();},
  spHwQuitCancel(){ui.spHwQuitAsk=false;render();},
  spHwQuitResume(){ui.spHwQuitAsk=false;ui.spRun=null;ui.spHw=null;ui.screen='today';render();},
  spHwQuitDiscard(){const hw=ui.spHw;if(hw)spellClearProgress(hw.listId);ui.spHwQuitAsk=false;ui.spRun=null;ui.spHw=null;ui.screen='today';render();}
};

/* estadísticas de Dictado (antes la pestaña "Historial" aparte, ahora una sección dentro de
   "Actividad e Historial", ver tabActividad). Devuelve el HTML en vez de pintarlo directamente,
   para poder componerlo junto con el día a día de Actividad. */
function historialBodyHTML(){
  const H=state.history,fd=d=>new Date(d).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'});
  if(!H.length)return '<p class="mute">Todavía no hay correcciones. Cuando Julia haga un dictado y pulse «Corregir», aquí verás sus estadísticas.</p>';
  const pct=h=>h.total?Math.round(100*(h.total-h.wrong)/h.total):100,avg=a=>a.length?Math.round(a.reduce((s,h)=>s+pct(h),0)/a.length):0;
  const chr=H.slice().reverse(),n=H.length,totErr=H.reduce((s,h)=>s+h.wrong,0),totW=H.reduce((s,h)=>s+h.total,0);
  const last5=avg(H.slice(0,5)),prev5=avg(H.slice(5,10)),trend=H.length>5?(last5-prev5>=3?`📈 mejora (+${last5-prev5} puntos)`:prev5-last5>=3?`📉 baja (${last5-prev5} puntos)`:'➡️ estable'):'';
  /* palabras */
  const W={};H.forEach(h=>h.errs.forEach(e=>{if(e.type==='extra'||!e.correct)return;const k=e.correct.toLowerCase(),o=W[k]||(W[k]={w:e.correct,n:0,miss:0,typed:{},last:h.date,rule:''});o.n++;if(e.type==='missing')o.miss++;else{o.typed[e.typed]=(o.typed[e.typed]||0)+1;if(e.rule)o.rule=e.rule;}if(h.date>o.last)o.last=h.date;}));
  const words=Object.values(W).sort((a,b)=>b.n-a.n||a.w.localeCompare(b.w,'es'));
  /* reglas */
  const R={};H.forEach(h=>h.errs.forEach(e=>{if(e.type==='sub'&&e.rule)R[e.rule]=(R[e.rule]||0)+1;}));
  const rules=Object.entries(R).sort((a,b)=>b[1]-a[1]).slice(0,6),maxR=rules.length?rules[0][1]:1;
  /* por dictado */
  const D={};chr.forEach(h=>{const k=h.did||h.title,o=D[k]||(D[k]={t:h.title,list:[]});o.list.push(h);o.t=h.title;});
  const dicts=Object.values(D).sort((a,b)=>b.list[b.list.length-1].date.localeCompare(a.list[a.list.length-1].date));
  const stat=(v,l)=>`<div style="flex:1;min-width:120px;background:#f3f0ff;border-radius:14px;padding:12px;text-align:center"><div style="font-size:1.7rem;font-weight:800;color:var(--pri2)">${v}</div><small class="mute">${l}</small></div>`;
  const spark=list=>list.slice(-12).map(h=>{const p=pct(h);return `<i title="${p}%" style="display:inline-block;width:12px;height:${8+p*.3}px;background:${p>=90?'var(--ok)':p>=70?'var(--warn)':'var(--bad)'};border-radius:3px;margin-right:3px;vertical-align:bottom"></i>`;}).join('');
  return `<div class="row" style="gap:10px;flex-wrap:wrap">${stat(n,'dictados hechos')}${stat(avg(H)+'%','acierto medio')}${stat(totErr,'palabras falladas')}${stat(H.reduce((s,h)=>s+(h.punct||0),0),'fallos de puntuación')}</div>
  ${trend?`<p class="mute" style="margin:8px 0">Últimos 5 dictados: <b>${last5}%</b> de acierto · ${trend}</p>`:''}
  <h3>🔴 Palabras que más falla</h3>
  ${words.length?`<div class="panel" style="padding:8px 16px"><table style="width:100%;border-collapse:collapse;font-size:1rem">
   <tr class="mute" style="text-align:left"><th>Palabra</th><th>Veces</th><th>Cómo la escribe</th></tr>
   ${words.slice(0,25).map(w=>`<tr style="border-top:1px solid var(--line)"><td style="padding:8px 0"><b>${esc(w.w)}</b>${w.rule?`<br><small class="mute">${esc(w.rule)}</small>`:''}</td><td style="text-align:center"><span class="wrong">${w.n}</span></td><td><small>${Object.entries(w.typed).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`${esc(t)}${c>1?' ×'+c:''}`).join(', ')}${w.miss?`${Object.keys(w.typed).length?', ':''}se la deja ×${w.miss}`:''}</small></td></tr>`).join('')}</table>${words.length>25?`<small class="mute">…y ${words.length-25} palabras más.</small>`:''}</div>`:'<p class="mute">Sin fallos todavía. ¡Genial! 🎉</p>'}
  ${rules.length?`<h3>📘 Reglas que más se le atragantan</h3><div class="panel">${rules.map(([t,c])=>`<div style="margin:6px 0"><small>${esc(t)}</small><div class="bar"><i style="width:${Math.round(100*c/maxR)}%;background:var(--bad)"></i></div><small class="mute">${c} ${c===1?'vez':'veces'}</small></div>`).join('')}</div>`:''}
  <h3>📝 Por dictado</h3>
  ${dicts.map(g=>{const l=g.list;return `<div class="panel"><b>${esc(g.t)}</b><br><small class="mute">${l.length} ${l.length===1?'vez':'veces'} · media ${avg(l)}% · mejor ${Math.max(...l.map(pct))}% · último ${pct(l[l.length-1])}% (${l[l.length-1].wrong} ${l[l.length-1].wrong===1?'fallo':'fallos'})</small><div style="margin-top:6px;height:50px;display:flex;align-items:flex-end">${spark(l)}</div></div>`;}).join('')}
  <h3>🕒 Cada intento</h3>
  <div class="list">${H.map(h=>{const w=h.errs.filter(e=>e.type!=='extra').map(e=>e.type==='sub'?`${esc(e.typed)} → <b>${esc(e.correct)}</b>`:`falta <b>${esc(e.correct)}</b>`);
    return `<div class="panel"><b>${esc(h.title)}</b> <span class="mute">· ${fd(h.date)}${h.photo?' · 📷':''}</span><br>${h.total-h.wrong} de ${h.total} palabras bien (${pct(h)}%)${h.punct?` · ${h.punct} de puntuación`:''}${w.length?`<br><small>${w.join(' · ')}</small>`:''}</div>`;}).join('')}</div>
  <button class="btn danger" data-act="clearHist">Borrar historial</button>`;
}

async function voiceMissing(d){return Voz.missing(voiceTexts(dictChunks(d)));}
async function refreshVoiceStatus(){
  for(const d of state.dictados){const el=document.querySelector(`[data-vs="${CSS.escape(d.id)}"]`);if(!el)continue;
    try{const m=await voiceMissing(d);el.textContent=m.length?`🎙 Faltan ${m.length} frases por generar`:'🎙 Voz lista';}catch(e){el.textContent='🎙 Voz no disponible';}}

async function genVoiceFor(id,explicit){
  const d=state.dictados.find(x=>x.id===id);if(!d||!Voz.ready())return;
  const el=()=>document.querySelector(`[data-vs="${CSS.escape(id)}"]`),say=m=>{const e=el();if(e)e.textContent=m;};
  const miss=await voiceMissing(d);
  if(!miss.length){say('🎙 Voz lista');if(explicit)toast('La voz de este dictado ya está lista');return;}
  say(`🎙 Generando 0 de ${miss.length}…`);
  const r=await Voz.prepare(miss,(ok,ko)=>say(`🎙 Generando ${ok+ko} de ${miss.length}…`));
  if(r.fail){say(`🎙 Faltan ${r.fail} frases`);toast(r.err||'No se pudo generar toda la voz');}else{say('🎙 Voz lista');toast('Voz generada ✔');}
}
const tutorActions={
  pinSet(){const a=$('#pin1').value,b=$('#pin2').value;if(!/^\d{4,8}$/.test(a))return toast('El PIN debe tener de 4 a 8 números');if(a!==b)return toast('Los PIN no coinciden');state.pin=a;save();ui.unlocked=true;render();},

  saveDict(){const title=$('#dTitle').value.trim(),text=$('#dText').value.trim(),tema=($('#dTema')&&$('#dTema').value||'').trim();if(!title||!text)return toast('Pon un título y un texto');
    snapUndo();
    /* si el texto cambia, se borra la clasificación morfológica que tuviera guardada (si se

    if(ui.editId){const d=state.dictados.find(x=>x.id===ui.editId);if(d.text!==text){d.morfoCats=null;d.morfoSubs=null;d.morfoMorf=null;}d.title=title;d.text=text;d.tema=tema;}else state.dictados.unshift({id:'d'+uid(),title,text,tema});
    save();const nid=ui.editId||state.dictados[0].id;ui.editId=null;render();toast('Dictado guardado');if(Voz.ready())genVoiceFor(nid,false);},
  delDict(b){if(confirm('¿Borrar este dictado?')){snapUndo();state.dictados=state.dictados.filter(d=>d.id!==b.dataset.id);save();render();}},
  /* copia un dictado a Análisis Morfológico: crea una entrada NUEVA en state.morfos con el mismo
     título y texto, sin tocar el dictado original -- David quiere poder usar el mismo texto en
     las dos actividades (no "mover" el dictado de un sitio a otro), para que Julia lo repase dos
     veces de forma distinta y se le quede mejor. Si el dictado ya tenía una clasificación
     morfológica guardada (de haberlo analizado antes con "🔤" desde la lista de Julia), se
     reutiliza en la copia nueva en vez de volver a gastar IA, ya que el texto es idéntico.
     Después se salta directamente a la pestaña de Morfología para que el tutor vea el resultado. */
  dictToMorfo(b){
    const d=state.dictados.find(x=>x.id===b.dataset.id);if(!d)return;
    snapUndo();
    state.morfos.unshift({id:'mz'+uid(),title:d.title,text:d.text,morfoCats:d.morfoCats||null,morfoSubs:d.morfoSubs||null,morfoMorf:d.morfoMorf||null});

    toast('Copiado a Análisis Morfológico ✔');
  },
  /* la acción contraria a dictToMorfo: copia un texto de Análisis Morfológico a Dictados, creando
     un dictado NUEVO e independiente (sin tema, porque Morfología no tiene ese campo) con el
     mismo título y texto, sin tocar el texto de morfología original. Igual que dictToMorfo
     reutiliza la clasificación morfológica ya calculada en vez de volver a gastar IA (el dictado
     nuevo también puede usarse para análisis morfológico como deber, ver morfoStart). Sirve,
     entre otras cosas, para recuperar en Dictados un dictado que se hubiera "movido" por error
     con una versión anterior de dictToMorfo (antes de que se cambiara a copiar en vez de mover). */
  morfoToDict(b){

const ALL=Object.assign({},studentActions,tutorActions,fixActions,taskActions,deberesActions,taskAddActions,examActions,studyActions,miniActions,morfoActions,prepActions,engDictActions,spellActions,spellRunActions);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  /* "despierta" el audio del sonido de acierto/fallo en el primer click de lo que sea: en iOS/
     Safari un AudioContext solo se puede crear/reanudar dentro de un gesto del usuario, y algunas
     de las acciones que acaban llamando a chime() (p.ej. studyCheck, si pide una 2ª opinión a la
     IA) lo hacen después de un await, ya fuera del gesto original. Haciéndolo aquí, en el mismo
     listener que despacha TODAS las acciones (synchronous, antes de cualquier await), se evita
     que el primer sonido se pierda por llegar tarde a crear el audio. */
  _fxAudioCtx();
  const f=ALL[b.dataset.act];if(f)f(b,e);});
document.addEventListener('input',e=>{const t=e.target;

  if(t.dataset.ai){const k=t.dataset.ai;state.ai[k]=t.type==='checkbox'?t.checked:k==='speed'?+t.value:t.value;save();if(k==='speed'){const l=$('#v_aispeed');if(l)l.textContent=state.ai.speed+'×';}}
  if(t.dataset.set2==='miniGameEvery'){state.miniGameEvery=+t.value;save();const l=$('#v_miniGameEvery');if(l)l.textContent='cada '+state.miniGameEvery+' ejercicios';}

});

});
/* ---- arrastrar y soltar fotos directamente encima de un "cuadro" (en vez de tener que pulsar el
   botón de subir): cualquier elemento marcado con data-dropzone="<tipo>" acepta soltar imágenes
   encima, con el mismo efecto que elegirlas con el botón correspondiente. Por ahora solo hay un
   tipo ("exPhotos": fotos de los apuntes de una tarjeta de teoría/examen), pero el mecanismo es
   genérico por si se añaden más "cuadros" de subir foto más adelante.
   Dos cosas a las que hay que tener cuidado (encontradas por la revisión adversarial):
   1) si se suelta un archivo FUERA de cualquier cuadro (o encima pero sin ser una imagen real -se
      comprueba con dataTransfer.types, que ya lo dice durante el arrastre, antes de soltar-), hay
      que evitar igualmente que el navegador lo abra él mismo y se salga de la app entera.
   2) si lo que se arrastra no es un archivo (p.ej. texto seleccionado hacia el cuadro de notas,
      que ya sabe aceptar texto por sí mismo), no hay que tocar nada: se deja el comportamiento
      nativo tal cual, sin mostrar ningún aviso de "eso no son fotos". */
const DROPZONE_HANDLERS={exPhotos:files=>readNotesPhotos(files)};
function dzEl(e){return e.target&&e.target.closest&&e.target.closest('[data-dropzone]');}
function dzHasFiles(e){const dt=e.dataTransfer;return !!(dt&&dt.types&&Array.from(dt.types).includes('Files'));}
document.addEventListener('dragover',e=>{if(dzHasFiles(e))e.preventDefault();});
document.addEventListener('dragenter',e=>{const z=dzEl(e);if(!z||!dzHasFiles(e))return;e.preventDefault();z.classList.add('dropzone-on');});
document.addEventListener('dragleave',e=>{const z=dzEl(e);if(!z)return;if(z.contains(e.relatedTarget))return;z.classList.remove('dropzone-on');});
document.addEventListener('drop',e=>{
  if(!dzHasFiles(e))return; // no es un archivo (p.ej. arrastran texto): se deja el comportamiento nativo del elemento
  e.preventDefault(); // evita que el navegador abra el archivo él mismo, caiga donde caiga
  const z=dzEl(e);if(!z)return;
  z.classList.remove('dropzone-on');
  const handler=DROPZONE_HANDLERS[z.dataset.dropzone];if(!handler)return;
  const all=[...(e.dataTransfer&&e.dataTransfer.files||[])];
  const files=all.filter(f=>f.type&&f.type.startsWith('image/'));
  if(!files.length)return toast('Eso no son fotos: arrastra una imagen (jpg, png…)');
  if(files.length<all.length){const nOther=all.length-files.length;toast(`📷 Subiendo ${files.length} ${files.length===1?'foto':'fotos'}; se ${nOther===1?'ha ignorado 1 archivo':'han ignorado '+nOther+' archivos'} que no ${nOther===1?'era una foto':'eran fotos'} (usa los botones de PDF/presentación para esos).`);}
  handler(files);
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;
  /* mismo motivo que en el listener de click: varias de estas acciones (p.ej. spDictCheckMeaning,
     o studyCheck cuando pide una 2ª opinión a la IA) llaman a chime() DESPUÉS de un await, ya
     fuera del gesto del usuario -- si solo se "despertara" el audio en los clics de botones, una
     corrección hecha pulsando Enter en el teclado (en vez de tocar el botón) podría perder el
     primer sonido si el audio necesitaba reactivarse justo en ese momento. */
  _fxAudioCtx();
  if(t.dataset.enter==='word')fixActions.word({dataset:{i:t.dataset.i}});
  if(t.dataset.enter==='mans')taskActions.mcheck();
  if(t.dataset.enter==='opin')fixActions.origGo();
  if(t.dataset.enter==='pin')tutorActions.pinEnter();
  if(t.dataset.enter==='studyAns')studyActions.studyCheck();
  if(t.dataset.enter==='dictWord')engDictActions.dictSearch();
  if(t.dataset.enter==='dictGuess')engDictActions.dictReveal();
  if(t.dataset.enter==='spDictAns'){const r=ui.spRun;if(r&&r.stage==='checked')spellRunActions.spDictNext();else spellRunActions.spDictCheck();}
  if(t.dataset.enter==='spDictMeaning'){
    const r=ui.spRun;
    if(r&&r.stage==='photowait'){const mSt=(r.photoMeaningOk||[])[r.i];if(mSt===undefined)spellRunActions.spDictCheckMeaning();else spellRunActions.spDictPhoneNext();}
    else if(r&&r.stage==='checked'){if(r.meaningOk===undefined)spellRunActions.spDictCheckMeaning();else spellRunActions.spDictNext();}
  }
  if(t.dataset.enter==='spSentAns'){const r=ui.spRun;if(r&&r.stage==='checked')spellRunActions.spSentNext();else spellRunActions.spSentCheck();}
  if(t.dataset.enter==='spDictRetype')spellRunActions.spDictRetypeCheck();
  if(t.dataset.enter==='studyWriteAns')studyActions.studyWriteCheck();
  if(t.dataset.enter==='morfoWriteAns')morfoActions.morfoWriteCheck();
  if(t.dataset.enter==='morfoSkipPin')morfoActions.morfoSkipGo();
  if(t.dataset.enter==='morfoExtraRaiz')morfoActions.morfoExtraRaizCheck();
  if(t.dataset.enter==='prepWriteAll')prepActions.prepExamCheck();});
render();
async function readDictPhotos(files){
  const st=$('#dictPhotoSt');if(!state.ai.photoOn){if(st)st.textContent='';return toast('Activa la IA de fotos en Ajustes para leer fotos');}
  const ta=$('#dText'),ti=$('#dTitle');if(!ta)return;
  files=files.slice(0,4);let out=[],title='';
  try{
    for(let i=0;i<files.length;i++){
      if(st)st.innerHTML=`🔎 Leyendo la foto ${i+1} de ${files.length}… unos segundos`;
      const r=await readPrinted(await fileToJpeg(files[i]));if(!title)title=r.title;out.push(r.text);
    }
    const txt=out.join('\n\n');
    if(ta.value.trim()&&!confirm('Ya hay un texto escrito. ¿Quieres sustituirlo por el de la foto?')){if(st)st.textContent='';return;}
    ta.value=txt;if(ti&&!ti.value.trim()&&title)ti.value=title;
    if(st)st.innerHTML='✅ <b>Texto leído.</b> Revísalo con calma: la IA puede equivocarse en alguna letra o signo. Corrígelo aquí mismo y pulsa Guardar.'+(/\[\?\]/.test(txt)?' <span class="wrong">Hay partes ilegibles marcadas con [?]: escríbelas tú.</span>':'');
  }catch(e){if(st)st.textContent='';toast(e.message);}
}
